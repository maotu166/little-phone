  }catch(e){ return false; }
}

/* 生成图案壁纸的 CSS background-image 值 */
function wpImage(){
  var k = TH.wpkind;
  if(k === 'none') return 'none';
  if(k === 'custom'){
    var d = loadWP();
    return d ? 'url("' + d + '")' : 'none';
  }
  var base = thv('bg1');
  var c1 = shift(base, 9), c2 = shift(base, 22), c3 = shift(base, -4);
  if(k === 'dots'){
    return 'radial-gradient(' + c2 + ' 1.9px, transparent 2px)';
  }
  if(k === 'grid'){
    return 'linear-gradient(' + c2 + ' 1px, transparent 1px),' +
           'linear-gradient(90deg,' + c2 + ' 1px, transparent 1px)';
  }
  if(k === 'lines'){
    return 'repeating-linear-gradient(45deg,' + c2 + ' 0 1.4px, transparent 1.4px 11px)';
  }
  if(k === 'blob'){
    return 'radial-gradient(60% 45% at 22% 18%,' + shift(base,30) + ' 0%, transparent 62%),' +
           'radial-gradient(55% 40% at 82% 74%,' + shift(base,20) + ' 0%, transparent 58%),' +
           'radial-gradient(70% 50% at 50% 108%,' + c1 + ' 0%, transparent 60%),' +
           'linear-gradient(165deg,' + c3 + ',' + base + ')';
  }
  return 'none';
}
function wpSize(){
  var k = TH.wpkind;
  if(k === 'dots') return '26px 26px';
  if(k === 'grid') return '30px 30px, 30px 30px';
  if(k === 'lines') return 'auto';
  return 'cover';
}
function wpRepeat(){
  return (TH.wpkind === 'custom' || TH.wpkind === 'blob' || TH.wpkind === 'none') ? 'no-repeat' : 'repeat';
}

function applyTheme(){
  var r = document.documentElement.style;
  var p = THEMES[TH.preset];

  /* 色彩浓度：60-180，100 是主题原样。背景和光晕一起推，别的不动 */
  var vv = +TH.vivid;
  if(isNaN(vv)) vv = 100;
  if(vv < 60) vv = 60;
  if(vv > 180) vv = 180;
  function vg(key){ return vividify(thv(key), vv); }

  r.setProperty('--bg1', vg('bg1'));
  r.setProperty('--bg2', vg('bg2'));
  r.setProperty('--bg3', vg('bg3'));
  r.setProperty('--glow1', TH.glow ? vg('glow1') : 'transparent');
  r.setProperty('--glow2', TH.glow ? vg('glow2') : 'transparent');
  r.setProperty('--accent', vg('accent'));
  r.setProperty('--win', vg('win'));
  r.setProperty('--tile-r', TH.radius + 'px');

  /* 亮度不再由页面蒙纱模拟：网页读不到系统背光，自己铺一层黑/白纱只会跟真实背光打架。
     明暗完全交给手机屏幕背光，调光层和 bright 已整个撤掉。 */
  r.setProperty('--icoscale', TH.icoscale);

  var lightBg = !!p.light && !TH.bg1;
  if(TH.bg1) lightBg = isLight(TH.bg1);
  r.setProperty('--fg', lightBg ? '#1b1d22' : '#f2f4f8');
  r.setProperty('--label', lightBg ? 'rgba(20,22,26,.86)' : 'rgba(255,255,255,.88)');

  /* 图标卡片风格：白卡 / 暗卡 / 透明玻璃 */
  var st = TH.tilestyle;
  if(st === 'auto') st = lightBg ? 'light' : 'dark';
  if(st === 'light'){
    /* 白卡底上必须用深线条，不然浅色主题里图标会糊成一片白。
       卡片本身也不用纯白：掺一点主题色相，才不会在有色背景上显得突兀发白。 */
    var cardBg = lightBg ? tintWhite(vg('bg1'), 0.82) : '#ffffff';
    r.setProperty('--tile', lightBg ? cardBg : 'rgba(255,255,255,.93)');
    r.setProperty('--tint', inkOn(cardBg, vg('bg1'), 7));
    r.setProperty('--tile-sh', lightBg
      ? '0 4px 12px rgba(0,0,0,.20), inset 0 0 0 1px rgba(0,0,0,.05)'
      : '0 5px 14px rgba(0,0,0,.14)');
    r.setProperty('--cut', 'rgba(255,255,255,.96)');
  }else if(st === 'dark'){
    r.setProperty('--tile', 'rgba(24,27,34,.82)');
    r.setProperty('--tint', '#eef1f6');
    r.setProperty('--tile-sh', '0 6px 16px rgba(0,0,0,.38)');
    r.setProperty('--cut', 'rgba(24,27,34,.92)');
  }else{
    r.setProperty('--tile', lightBg ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.13)');
    r.setProperty('--tint', lightBg ? '#1b1d22' : '#f2f4f8');
    r.setProperty('--tile-sh', 'inset 0 1px 0 rgba(255,255,255,.14)');
    r.setProperty('--cut', lightBg ? 'rgba(255,255,255,.95)' : 'rgba(22,25,31,.88)');
  }
  /* 原来这里对深色主题下的白卡再硬改一次 tint，inkOn 已经保证对比，不需要了 */

  /* 壁纸 */
  var img = wpImage();
  r.setProperty('--wp', img);
  r.setProperty('--wp-blur', (TH.wpkind === 'custom' ? TH.wpblur : 0) + 'px');
  var wpEl = document.getElementById('wp');
  if(wpEl){
    wpEl.style.backgroundSize = wpSize();
    wpEl.style.backgroundRepeat = wpRepeat();
  }
  document.body.classList.toggle('haswp', TH.wpkind === 'custom' && img !== 'none');
  document.body.classList.toggle('lightmode', lightBg);
  document.body.classList.toggle('nolabel', !TH.labels);
}
function isLight(hex){
  var h = String(hex).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length !== 6) return false;
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (r*0.299 + g*0.587 + b*0.114) > 150;
}

/* ---------- 存档 ---------- */
function loadLayout(){
  try{
    /* 先看有没有 v3 档 */
    var raw3 = localStorage.getItem(LS_V3);
    if(raw3){
      var o3 = JSON.parse(raw3);
      var ok = sanitize(o3);
      if(ok) return ensureApps(ok);
    }
    /* 没有 v3，看能不能从 v2 老档迁过来 */
    var raw2 = localStorage.getItem(LS_KEY);
    if(raw2){
      var mig = migrateV2(JSON.parse(raw2));
      if(mig){ mig = ensureApps(mig); L = mig; saveLayout(); return mig; }
    }
    return clone(DEFAULT);
  }catch(e){
    return clone(DEFAULT);
  }
}

/* 老档补齐：新加的核心应用（微信、档案）如果不在布局里，自动找空位放进去。
   只补一次，放完就存档；用户自己删掉的不会硬塞回来——靠 LS_SEEDED 记账。 */
var LS_SEEDED = 'little_phone_seeded_v1';
var MUST_APPS = ['wechat', 'archive'];

function ensureApps(o){
  var seeded = [];
  try{ seeded = JSON.parse(localStorage.getItem(LS_SEEDED) || '[]'); }catch(e){ seeded = []; }
  if(!Array.isArray(seeded)) seeded = [];

  var changed = false;
  MUST_APPS.forEach(function(id){
    if(seeded.indexOf(id) >= 0) return;          /* 放过一次了，用户删了就算他的意思 */
    if(!REG[id]) return;                          /* 注册表里没这个应用，别乱放 */

    /* 已经在某一屏或 dock 里就只记账不重放 */
    var here = false;
    if(o.dock.indexOf(id) >= 0) here = true;
    o.screens.forEach(function(s){
      s.forEach(function(it){ if(it && it.t === 'a' && it.id === id) here = true; });
    });
    if(here){ seeded.push(id); changed = true; return; }

    /* 找第一屏的空位，第一屏满了就往后面屏找 */
    var placed = false;
    for(var i = 0; i < o.screens.length && !placed; i++){
      var pos = findFree(o.screens[i], 1, 1);
      if(pos){
        o.screens[i].push({ t:'a', id:id, x:pos.x, y:pos.y, w:1, h:1 });
        placed = true;
      }
    }
    if(placed){ seeded.push(id); changed = true; }
  });

  if(changed){
    try{ localStorage.setItem(LS_SEEDED, JSON.stringify(seeded)); }catch(e){}
    try{ localStorage.setItem(LS_V3, JSON.stringify(o)); }catch(e){}
  }
  return o;
}

/* v3 档洗一遍：补坐标、夹进边界、去重叠。返回 null 表示这档没救 */
function sanitize(o){
  if(!o || !Array.isArray(o.screens) || !o.screens.length) return null;
  if(!Array.isArray(o.dock)) o.dock = clone(DEFAULT.dock);
  o.dock = o.dock.filter(validId).slice(0, 5);
  o.screens = o.screens.map(function(s){
    if(!Array.isArray(s)) return [];
    var out = [];
    s.forEach(function(it){
      var c = fixCell(it);
      if(!c) return;
      /* 越界或压到已放好的，就另找空位，不丢东西 */
      if(!inBounds(c) || occupied(out, c, null)){
        var f = findFree(out, c.w, c.h, null);
        c.x = f.x; c.y = f.y;
      }
      out.push(c);
    });
    return out;
  });
  o.v = 3;
  return o;
}

/* 单项洗净：认 v3 对象，也兜 v2 残留的写法 */
function fixCell(it){
  if(typeof it === 'string'){
    /* v2 的裸字符串图标 */
    return validId(it) ? { t:'a', id:it, x:0, y:0, w:1, h:1 } : null;
  }
  if(!it || typeof it !== 'object') return null;

  /* v2 卡片：{ w:'photo', k, size } —— w 是类型名，size 是档位 */
  if(!it.t && typeof it.w === 'string' && WKIND[it.w]){
    var sz = WSIZE[it.size] || WSIZE[WKIND[it.w].dft];
    return { t:'w', w2:it.w, k:it.k || newWKey(), x:0, y:0, w:sz.cols, h:sz.rows };
  }

  if(it.t === 'a'){
    if(!validId(it.id)) return null;
    return { t:'a', id:it.id, x:num(it.x), y:num(it.y), w:1, h:1 };
  }
  if(it.t === 'w'){
    if(!WKIND[it.w2]) return null;
    var w = clampSpan(it.w, WMAX), h = clampSpan(it.h, HMAX);
    return { t:'w', w2:it.w2, k:it.k || newWKey(), x:num(it.x), y:num(it.y), w:w, h:h };
  }
  return null;
}
function num(v){ var n = parseInt(v, 10); return (isNaN(n) || n < 0) ? 0 : n; }
function clampSpan(v, mx){
  var n = parseInt(v, 10);
  if(isNaN(n) || n < 1) return 2;
  return n > mx ? mx : n;
}

/* v2 顺序数组 → v3 坐标：按原顺序从左到右、从上到下铺 */
function migrateV2(o){
  if(!o || !Array.isArray(o.screens)) return null;
  var out = { v:3, screens:[], dock:[] };
  out.dock = (Array.isArray(o.dock) ? o.dock : clone(DEFAULT.dock)).filter(validId).slice(0, 5);
  o.screens.forEach(function(s){
    var arr = [];
    if(Array.isArray(s)) s.forEach(function(it){
      var c = fixCell(it);
      if(!c) return;
      var f = findFree(arr, c.w, c.h, null);
      c.x = f.x; c.y = f.y;
      arr.push(c);
    });
    out.screens.push(arr);
  });
  if(!out.screens.length) out.screens = [[]];
  return out;
}

function saveLayout(){
  try{ localStorage.setItem(LS_V3, JSON.stringify(L)); }catch(e){}
}
function validId(id){ return typeof id === 'string' && !!REG[id]; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- 渲染桌面 ---------- */
function drawScreens(){
  var box = document.getElementById('screens');
  box.innerHTML = '';
  L.screens.forEach(function(arr, si){
    var sc = document.createElement('div');
    sc.className = 'screen';
    sc.dataset.si = si;

    var grid = document.createElement('div');
    grid.className = 'grid';
    var rows = screenRows(arr);
    grid.style.gridTemplateRows = 'repeat(' + rows + ', var(--cellh))';
    grid.dataset.rows = rows;

    /* 先铺一层空格子当落点，整理态才看得见 */
    for(var y=0;y<rows;y++){
      for(var x=0;x<GCOL;x++){
        var sl = document.createElement('div');
        sl.className = 'cell';
        sl.dataset.cx = x;
        sl.dataset.cy = y;
        sl.dataset.si = si;
        sl.style.gridColumn = (x + 1) + ' / span 1';
        sl.style.gridRow = (y + 1) + ' / span 1';
        grid.appendChild(sl);
      }
    }

    /* 再把图标和卡片按坐标压上去 */
    arr.forEach(function(it, idx){
      var el = isWidget(it) ? wgNode(it, si, idx) : appNode(it, si, idx);
      el.style.gridColumn = (it.x + 1) + ' / span ' + it.w;
      el.style.gridRow = (it.y + 1) + ' / span ' + it.h;
      grid.appendChild(el);
    });

    sc.appendChild(grid);
    box.appendChild(sc);
  });
  drawDots();
}

/* ---------- 小组件节点 ---------- */
function wgNode(it, si, index){
  var d = wgData(it.k);
  var el = document.createElement('div');
  /* 带上类型类名，样式才好按卡种写（情侣卡靠这个吃 .wg.pairw） */
  el.className = 'wg ' + it.w2;
  el.dataset.wg = it.k;
  el.dataset.si = si;
  el.dataset.wi = index;

  /* 单独的圆角 */
  if(d.r != null){
    el.style.borderRadius = d.r + 'px';
    if(it.w2 === 'calw') el.style.setProperty('--cal-r', d.r + 'px');
  }

  var hasImg = !!d.img;
  var h = '';
  /* 日历卡的图只当头图铺在顶部，不盖日期网格——盖了数字就看不清了。
     其余卡片照旧整卡铺满。 */
  var headOnly = (it.w2 === 'calw');
  if(hasImg){
    el.classList.add('onimg');
    if(headOnly) el.classList.add('headimg');
    h += '<div class="wgimg' + (headOnly ? ' head' : '') + '" style="background-image:url(\'' + d.img + '\')"></div>';
    h += '<div class="wgveil' + (headOnly ? ' head' : '') + '"></div>';
  }
  h += '<div class="wgx">×</div>';
  h += '<div class="wgin">' + wgInner(it, d, hasImg) + '</div>';
  if(!hasImg && (it.w2 === 'photo' || it.w2 === 'frame')){
    h += '<div class="wgph">' + icoSVG('photos') + '</div>';
  }
  h += '<div class="wgrz"></div>';
  el.innerHTML = h;
  if(it.w2 === 'clockw' || it.w2 === 'datew') el.classList.add('center');
  return el;
}

/* 卡片里面写什么 */
function wgInner(it, d, hasImg){
  var now = new Date();
  var W = ['周日','周一','周二','周三','周四','周五','周六'];
  if(it.w2 === 'clockw'){
    var hh = ('0' + now.getHours()).slice(-2), mm = ('0' + now.getMinutes()).slice(-2);
    return '<div class="wgbig wg-tick">' + hh + ':' + mm + '</div>' +
           '<div class="wgsm">' + (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日 ' + W[now.getDay()] + '</div>';
  }
  if(it.w2 === 'datew'){
    return '<div class="wgmid">' + (now.getMonth()+1) + '月' + now.getDate() + '日</div>' +
           '<div class="wgsm">' + W[now.getDay()] + '</div>';
  }
  /* 日历卡：桌面上一眼看整月，只放数字不放农历（格子太小塞不下）。
     点开才是完整日历应用，那里才有农历节气。 */
  if(it.w2 === 'calw'){
    var cy = now.getFullYear(), cm = now.getMonth(), cd = now.getDate();
    var first = new Date(cy, cm, 1).getDay();
    var days = new Date(cy, cm + 1, 0).getDate();
    var s = '<div class="cw-top">' +
              '<span class="cw-m">' + (cm + 1) + ' 月</span>' +
              '<span class="cw-y">' + cy + '</span>' +
            '</div>';
    s += '<div class="cw-grid">';
    ['日','一','二','三','四','五','六'].forEach(function(w, i){
      s += '<span class="cw-w' + (i === 0 || i === 6 ? ' wknd' : '') + '">' + w + '</span>';
    });
    for(var i = 0; i < first; i++) s += '<span class="cw-d out"></span>';
    for(var dd = 1; dd <= days; dd++){
      var wd = (first + dd - 1) % 7;
      var cls = 'cw-d';
      if(wd === 0 || wd === 6) cls += ' wknd';
      if(dd === cd) cls += ' on';
      s += '<span class="' + cls + '">' + dd + '</span>';
    }
    /* 月末补满最后一行：不补的话最后一行残缺，底衬却是整块的，
       看起来就像卡片下面多挂了一块空档。 */
    var tail = (first + days) % 7;
    if(tail) for(var t2 = tail; t2 < 7; t2++) s += '<span class="cw-d out"></span>';
    s += '</div>';
    return s;
  }
/* 情侣卡：两个圆头像框，中间连线带心。
      img1/img2 独立存储，没图显示空白圈+提示。
      say1/say2 是主对话框，kao1/kao2 是右下角小颜文字，lyric1/lyric2 是两行歌词，都可留空。
      bg 是整卡背景图，铺在最底层，不遮播放器/歌词/头像。 */
  if(it.w2 === 'pairw'){
    var s = '';
    /* 背景图：单独一层垫在最底，z-index 比装饰层和内容都低 */
    if(d.bg) s += '<div class="pw-bg" style="background-image:url(\'' + d.bg + '\')"></div>';
    /* 上半区：歌词+播放器 */
    s += '<div class="pw-top">';
    /* 两行歌词在最上面 */
    if(d.lyric1) s += '<div class="pw-lyric">' + esc(d.lyric1) + '</div>';
    if(d.lyric2) s += '<div class="pw-lyric">' + esc(d.lyric2) + '</div>';
    /* 播放器：歌名+音波、进度条、控制按钮 */
    s += '<div class="pw-player">';
    /* 歌名行：走独立的 song 字段，不能再拿 lyric1 顶，否则第一行歌词会重复出现两次 */
    s += '<div class="pw-song">' +
           '<div class="pw-wave"><i></i><i></i><i></i><i></i></div>' +
           '<span class="pw-song-name">' + esc(d.song || '未知歌曲') + '</span>' +
         '</div>';
    /* 进度条一行 */
    s += '<div class="pw-prow">' +
           '<span class="pw-player-time">0:17</span>' +
           '<div class="pw-player-bar">' +
             '<div class="pw-player-fill"></div>' +
             '<div class="pw-player-dot"></div>' +
           '</div>' +
           '<span class="pw-player-time">2:29</span>' +
         '</div>';
    /* 控制按钮 */
    s += '<div class="pw-ctrl">' +
           '<svg width="11" height="10" viewBox="0 0 11 10"><path d="M10 0 L0 5 L10 10 z" fill="currentColor" opacity=".7"/></svg>' +
           '<div class="pw-play">' +
             '<svg width="6" height="7" viewBox="0 0 6 7"><path d="M0 0 L6 3.5 L0 7 z" fill="currentColor"/></svg>' +
           '</div>' +
           '<svg width="11" height="10" viewBox="0 0 11 10"><path d="M0 0 L10 5 L0 10 z" fill="currentColor" opacity=".7"/></svg>' +
         '</div>';
    s += '</div>';
    s += '</div>';
    /* 头像+连线放最下面 */
    s += '<div class="pw-avatars">';
    [1, 2].forEach(function(n){
      if(n === 2) s += pwLinkHTML();
      var im = d['img' + n] || '';
      var say = d['say' + n] || '';
      var kao = d['kao' + n] || '';
      s += '<div class="pw-ava" data-slot="' + n + '">';
      s += '<div class="pw-ava-in">';
      if(im) s += '<div class="pw-ava-img" style="background-image:url(\'' + im + '\')"></div>';
      else s += '<div class="pw-ava-ph">点击<br>更换</div>';
      s += '</div>';
      if(say) s += '<div class="pw-say pw-say-' + (n === 1 ? 'l' : 'r') + '">' + esc(say) + '</div>';
      if(kao) s += '<div class="pw-kao">' + esc(kao) + '</div>';
      s += '</div>';
    });
    s += '</div>';
    return s;
  }
  if(it.w2 === 'note'){
    var txt = d.text || '点一下写字';
    return '<div class="wgnote">' + esc(txt) + '</div>';
  }
  if(it.w2 === 'frame'){
    return '<div class="wgmid">' + esc(d.title || '写个标题') + '</div>' +
           '<div class="wgsm">' + esc(d.text || '再写一句话') + '</div>';
  }
  if(it.w2 === 'music'){
    /* 音乐卡：左边慢转 CD，右边网易云那套播放器。歌词跑马灯来回滑。 */
    var s = '<div class="mw-wrap">';
    s += '<div class="mw-cd">';
    if(d.cd) s += '<img src="' + d.cd + '">';
    s += '</div>';
    s += '<div class="mw-right">';
    s += '<div class="mw-song">' + esc(d.song || '未知歌曲') + '</div>';
    /* 歌词：两行拼一句，跑马灯来回滑 */
    var lyr = [d.lyric1, d.lyric2].filter(function(x){ return x; }).join('　');
    if(lyr){
      s += '<div class="mw-lyrbox"><div class="mw-lyrin">' + esc(lyr) + '</div></div>';
    }
    s += '<div class="mw-bar"><div class="mw-fill"></div><div class="mw-dot"></div></div>';
    s += '<div class="mw-time"><span>1:02</span><span>' + esc(d.dur || '3:24') + '</span></div>';
    /* 控制行：红心 上一首 播放 下一首 列表 */
    s += '<div class="mw-ctrl">';
    /* 红心 */
    s += '<svg class="mw-heart" width="12" height="11" viewBox="0 0 24 22"><path d="M12 21C12 21 2 14.5 2 7.8 2 4.1 5 1.5 8.2 1.5c2 0 3.2 1 3.8 1.9.6-.9 1.8-1.9 3.8-1.9C19 1.5 22 4.1 22 7.8 22 14.5 12 21 12 21z" fill="currentColor"/></svg>';
    /* 上一首 */
    s += '<svg width="11" height="9" viewBox="0 0 12 10"><path d="M11 0 L2 5 L11 10 z" fill="currentColor"/><rect x="0" y="0" width="1.4" height="10" rx=".7" fill="currentColor"/></svg>';
    /* 播放键：描边圆 */
    s += '<div class="mw-play"><svg width="6" height="7" viewBox="0 0 6 7"><path d="M0 0 L6 3.5 L0 7 z" fill="currentColor"/></svg></div>';
    /* 下一首 */
    s += '<svg width="11" height="9" viewBox="0 0 12 10"><path d="M1 0 L10 5 L1 10 z" fill="currentColor"/><rect x="10.6" y="0" width="1.4" height="10" rx=".7" fill="currentColor"/></svg>';
    /* 播放列表 */
    s += '<svg width="11" height="9" viewBox="0 0 12 10"><rect x="0" y="0" width="12" height="1.4" rx=".7" fill="currentColor"/><rect x="0" y="4.3" width="12" height="1.4" rx=".7" fill="currentColor"/><rect x="0" y="8.6" width="8" height="1.4" rx=".7" fill="currentColor"/></svg>';
    s += '</div>';
    s += '</div>';
    s += '</div>';
    return s;
  }
  if(it.w2 === 'free'){
    /* 自由卡片：读它的 layer 数组进行渲染 */
    if(!d.layers || !d.layers.length) {
      return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.4);font-size:14px;padding:12px;text-align:center;">（空白自由卡）<br>长按点设置去加内容</div>';
    }
    var sh = '<div class="free-wrap" style="position:absolute;inset:0;overflow:hidden;border-radius:inherit;z-index:2">';
    d.layers.forEach(function(ly){
      var st = 'position:absolute;';
      if(ly.x != null) st += 'left:' + ly.x + '%;';
      if(ly.y != null) st += 'top:' + ly.y + '%;';
      if(ly.w != null) st += 'width:' + ly.w + '%;';
      if(ly.h != null) st += 'height:' + ly.h + '%;';
      if(ly.color) st += 'color:' + ly.color + ';';
      if(ly.r != null) st += 'border-radius:' + ly.r + 'px;';
      if(ly.op != null) st += 'opacity:' + ly.op + ';';
      if(ly.bg) st += 'background:' + ly.bg + ';';
      if(ly.z != null) st += 'z-index:' + ly.z + ';';

      if(ly.type === 'img'){
        if(ly.src) st += 'background-image:url(\'' + ly.src + '\');background-size:cover;background-position:center;';
        sh += '<div class="free-ly" style="' + st + '"></div>';
      } else if (ly.type === 'text') {
        st += 'display:flex;align-items:center;white-space:pre-wrap;';
        if(ly.align) st += 'justify-content:' + ly.align + ';text-align:' + (ly.align==='center'?'center':(ly.align==='flex-end'?'right':'left')) + ';';
        if(ly.size) st += 'font-size:' + ly.size + 'px;';
        if(ly.bold) st += 'font-weight:bold;';
        if(ly.shadow) st += 'text-shadow:0 1px 3px rgba(0,0,0,0.5);';
        sh += '<div class="free-ly" style="' + st + '">' + esc(ly.text || '') + '</div>';
      }
    });
    sh += '</div>';
    return sh;
  }

  /* photo：有图就只放图，可选一行小字 */
  if(d.text) return '<div class="wgsm">' + esc(d.text) + '</div>';
  return hasImg ? '' : '<div class="wgsm" style="text-align:center">点一下换图</div>';
}

/* 耳机线：一条下垂的弧线，两端翘起像挂在耳朵上。
   桌面卡和编辑面板预览共用这一份，改一次两边都跟着变。 */
function pwLinkHTML(){
  return '<div class="pw-link">' +
           '<div class="pw-line">' +
             '<svg viewBox="0 0 40 26" preserveAspectRatio="none">' +
               '<path d="M0 2 Q 10 24 20 18 Q 30 24 40 2" ' +
                     'fill="none" stroke="currentColor" stroke-width="1.6" ' +
                     'stroke-linecap="round" opacity=".6"/>' +
             '</svg>' +
           '</div>' +
           '<div class="pw-heart">♥</div>' +
         '</div>';
}

/* 找小组件在布局里的位置 */
function locateWG(k){
  for(var i=0;i<L.screens.length;i++){
    for(var j=0;j<L.screens[i].length;j++){
      var it = L.screens[i][j];
      if(isWidget(it) && it.k === k) return { si:i, index:j, it:it };
    }
  }
  return null;
}

function appNode(it, si, index){
  var id = (typeof it === 'string') ? it : (it && it.id);
  var a = REG[id];
  if(!a) { var bad = document.createElement('div'); bad.className = 'app'; return bad; }
  var el = document.createElement('div');
  el.className = 'app';
  el.dataset.app = id;
  if(si != null) el.dataset.si = si;
  if(index != null) el.dataset.ai = index;
  el.innerHTML = '<div class="ico">' + icoSVG(a.icon) + '</div><div class="nm">' + esc(appName(id)) + '</div>';
  return el;
}
function appName(id){
  var n = NAMES[id];
  if(typeof n === 'string' && n.trim()) return n.trim();
  return REG[id] ? REG[id].name : id;
}

function drawDock(){
  var d = document.getElementById('dock');
  d.innerHTML = '';
  L.dock.forEach(function(id){ d.appendChild(appNode(id)); });
}

function drawDots(){
  var box = document.getElementById('dots');
  box.innerHTML = '';
  L.screens.forEach(function(_, i){
    var dt = document.createElement('div');
    dt.className = 'dot' + (i === cur ? ' on' : '');
    dt.dataset.go = i;
    box.appendChild(dt);
  });
}
function syncDots(){
  var ds = document.querySelectorAll('#dots .dot');
  for(var i=0;i<ds.length;i++) ds[i].className = 'dot' + (i === cur ? ' on' : '');
}

function gotoScreen(i){
  var box = document.getElementById('screens');
  if(i < 0) i = 0;
  if(i > L.screens.length - 1) i = L.screens.length - 1;
  box.scrollTo({ left: i * box.clientWidth, behavior:'smooth' });
  cur = i;
  syncDots();
}

/* ---------- 应用窗口 ---------- */
function openWin(title, html){
  document.getElementById('win-title').textContent = title;
  document.getElementById('win-body').innerHTML = html;
  document.getElementById('win').classList.add('open');
  return document.getElementById('win-body');
}
function closeWin(){
  document.getElementById('win').classList.remove('open');
  if(winTimer){ clearInterval(winTimer); winTimer = null; }
}
var winTimer = null;

function openApp(id){
  var a = REG[id];
  if(!a) return;
  if(editing){ renameApp(id); return; }
  var nm = appName(id);
  if(typeof a.render === 'function'){
    a.render(openWin(nm, ''));
  }else if(typeof a.render === 'string'){
    /* 特殊字符串标记：wx系列不走窗口，走独立层 */
    if(a.render === 'wx'){ wxOpen(); return; }
    if(a.render === 'wxchars'){ wxOpen(); wxGo('chars'); return; }
    toast(nm + ' 的 render 标记不对');
  }else{
    openWin(nm,
      '<div class="card center" style="padding:36px 18px">' +
      '<div class="bigico">' + icoSVG(a.icon) + '</div>' +
      '<div style="font-size:15px;margin-bottom:8px">' + esc(nm) + ' 还没做</div>' +
      '<div class="hint">这个位置留着，想好要什么功能告诉我，<br>我一个一个往里填。</div>' +
      '</div>'
    );
  }
}

/* ---------- 改名 ---------- */
function renameApp(id){
  var body = openWin('改名字',
    '<div class="card center" style="padding:26px 18px">' +
      '<div class="bigico">' + icoSVG(REG[id].icon) + '</div>' +
      '<div class="sub">原名 ' + esc(REG[id].name) + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<input class="ipt" id="rn-in" maxlength="10" placeholder="想叫它什么" value="' + esc(appName(id)) + '">' +
      '<button class="btn" id="rn-ok">改好了</button>' +
      '<button class="btn" id="rn-rst" style="margin-top:9px">用回原名</button>' +
    '</div>' +
    '<div class="card hint">最多 10 个字，存在本机。</div>'
  );
  var ipt = body.querySelector('#rn-in');
  setTimeout(function(){ try{ ipt.focus(); ipt.select(); }catch(e){} }, 260);
  function commit(){
    var v = (ipt.value || '').trim();
    if(!v){ toast('名字不能空'); return; }
    if(v === REG[id].name) delete NAMES[id]; else NAMES[id] = v;
    saveNames(); drawScreens(); drawDock(); gotoScreen(cur); closeWin(); toast('改成「' + v + '」了');
  }
  body.querySelector('#rn-ok').onclick = commit;
  ipt.onkeydown = function(e){ if(e.key === 'Enter') commit(); };
  body.querySelector('#rn-rst').onclick = function(){
    delete NAMES[id]; saveNames();
    drawScreens(); drawDock(); gotoScreen(cur); closeWin(); toast('回到原名');
  };
}

/* ---------- 编辑态 + 拖拽移动 ---------- */
function setEditing(on){
  editing = !!on;
  document.body.classList.toggle('editing', editing);
  var sc = document.getElementById('screens');
  sc.style.scrollSnapType = editing ? 'none' : 'x mandatory';
}

var DG = null; // 拖拽中的状态

function dragStart(el, x, y){
  var wk = el.dataset.wg;
  if(wk){
    var wpos = locateWG(wk);
    if(!wpos) return;
    var wgh = document.createElement('div');
    wgh.id = 'ghost';
    var wd = wgData(wk);
    if(wd.img){
      wgh.style.background = 'center/cover no-repeat url(\'' + wd.img + '\')';
      wgh.innerHTML = '';
    }else{
      wgh.innerHTML = icoSVG('photos');
    }
    wgh.style.left = x + 'px';
    wgh.style.top = y + 'px';
    document.body.appendChild(wgh);
    el.classList.add('dragging');
    DG = {
      id:null, wk:wk, el:el, ghost:wgh,
      from:{ kind:'screen', si:wpos.si, index:wpos.index },
      item:wpos.it,
      /* 按住的位置在卡片里偏了几格，挪动时保持手感 */
      grab:grabOffset(el, x, y, wpos.it),
      edgeTimer:null, moved:false, drop:null
    };
    return;
  }
  var id = el.dataset.app;
  if(!id) return;
  var from = locate(id);
  if(!from) return;

  var g = document.createElement('div');
  g.id = 'ghost';
  g.innerHTML = icoSVG(REG[id].icon);
  g.style.left = x + 'px';
  g.style.top = y + 'px';
  document.body.appendChild(g);

  el.classList.add('dragging');
  DG = {
    id:id, wk:null, el:el, ghost:g, from:from,
    item:(from.kind === 'screen' ? L.screens[from.si][from.index] : null),
    grab:{ gx:0, gy:0 },
    edgeTimer:null, moved:false, drop:null
  };
}

/* 手指落在这一项的第几格上 */
function grabOffset(el, x, y, it){
  var r = el.getBoundingClientRect();
  var cw = r.width / Math.max(1, it.w), chh = r.height / Math.max(1, it.h);
  var gx = Math.floor((x - r.left) / Math.max(1, cw));
  var gy = Math.floor((y - r.top) / Math.max(1, chh));
  return {
    gx: Math.min(Math.max(gx, 0), it.w - 1),
    gy: Math.min(Math.max(gy, 0), it.h - 1)
  };
}

function dragMove(x, y){
  if(!DG) return;
  DG.moved = true;
  DG.ghost.style.left = x + 'px';
  DG.ghost.style.top = y + 'px';

  // 靠边自动翻页
  var w = window.innerWidth;
  var dir = x < 46 ? -1 : (x > w - 46 ? 1 : 0);
  if(dir && !DG.edgeTimer){
    DG.edgeTimer = setInterval(function(){
      var t = cur + dir;
      if(t < 0 || t > L.screens.length - 1){ stopEdge(); return; }
      gotoScreen(t);
    }, 700);
  }else if(!dir){ stopEdge(); }

  markSlot(x, y);
}
function stopEdge(){
  if(DG && DG.edgeTimer){ clearInterval(DG.edgeTimer); DG.edgeTimer = null; }
}

/* 把落点画出来：Dock 高亮图标，桌面高亮要占的那几格 */
function markSlot(x, y){
  clearMarks();
  var t = dropTarget(x, y);
  DG.drop = t;
  if(!t) return;
  if(t.kind === 'dock'){
    if(t.el) t.el.classList.add('slotmark');
    return;
  }
  var sc = document.querySelector('.screen[data-si="' + t.si + '"]');
  if(!sc) return;
  var cls = t.ok ? 'drop' : 'bad';
  for(var yy = t.y; yy < t.y + t.h; yy++){
    for(var xx = t.x; xx < t.x + t.w; xx++){
      var c = sc.querySelector('.cell[data-cx="' + xx + '"][data-cy="' + yy + '"]');
      if(c) c.classList.add(cls);
    }
  }
}
function clearMarks(){
  document.querySelectorAll('.app.slotmark,.wg.slotmark').forEach(function(e){ e.classList.remove('slotmark'); });
  document.querySelectorAll('.cell.drop,.cell.bad').forEach(function(e){ e.classList.remove('drop'); e.classList.remove('bad'); });
}

/* 找落点。
   Dock：{kind:'dock', index, el}
   桌面：{kind:'screen', si, x, y, w, h, ok} —— ok 表示这地方放得下 */
function dropTarget(x, y){
  var dock = document.getElementById('dock');
  var dr = dock.getBoundingClientRect();
  if(y >= dr.top && !DG.wk){
    var di = nearestIn(dock, x, y);
    return { kind:'dock', si:-1, index:di.index, el:di.el, ok:true };
  }
  var sc = document.querySelector('.screen[data-si="' + cur + '"]');
  if(!sc) return null;
  var g = sc.querySelector('.grid');
  if(!g) return null;

  var it = DG.item || { w:1, h:1 };
  var cell = cellAt(g, x, y);
  if(!cell) return null;

  /* 手指所在格减去抓握偏移，就是这一项左上角该落哪 */
  var nx = cell.x - DG.grab.gx;
  var ny = cell.y - DG.grab.gy;
  if(nx < 0) nx = 0;
  if(ny < 0) ny = 0;
  if(nx + it.w > GCOL) nx = GCOL - it.w;
  if(nx < 0) nx = 0;

  var rect = { x:nx, y:ny, w:it.w, h:it.h };
  var arr = L.screens[cur] || [];
  var skip = (DG.from.kind === 'screen' && DG.from.si === cur) ? DG.item : null;
  var ok = inBounds(rect) && !occupied(arr, rect, skip);

  return { kind:'screen', si:cur, x:nx, y:ny, w:it.w, h:it.h, ok:ok };
}

/* 坐标落在哪个格子上：优先命中真格子元素，落在缝里就按几何算 */
function cellAt(grid, x, y){
  var r = grid.getBoundingClientRect();
  var rows = +(grid.dataset.rows || GROW_MIN);
  var colw = r.width / GCOL;
  var rowh = r.height / Math.max(1, rows);
  var cx = Math.floor((x - r.left) / Math.max(1, colw));
  var cy = Math.floor((y - r.top) / Math.max(1, rowh));
  if(cx < 0) cx = 0;
  if(cx > GCOL - 1) cx = GCOL - 1;
  if(cy < 0) cy = 0;
  if(cy > rows - 1) cy = rows - 1;
  return { x:cx, y:cy };
}

function nearestIn(box, x, y){
  var nodes = box.querySelectorAll('.app[data-app],.wg[data-wg]');
  var best = null, bd = Infinity, bi = 0;
  for(var i=0;i<nodes.length;i++){
    if(nodes[i] === DG.el) continue;
    var r = nodes[i].getBoundingClientRect();
    var dx = x - (r.left + r.width/2), dy = y - (r.top + r.height/2);
    var d = dx*dx + dy*dy;
    if(d < bd){ bd = d; best = nodes[i]; bi = i; }
  }
  return { el:best, index:bi };
}

function dragEnd(x, y){
  if(!DG) return;
  stopEdge();
  var oldPos = capturePositions();  /* 改数据前先拍快照 */
  var t = DG.moved ? dropTarget(x, y) : null;
  DG.el.classList.remove('dragging');
  clearMarks();
  if(DG.ghost.parentNode) DG.ghost.parentNode.removeChild(DG.ghost);
  var id = DG.id, wk = DG.wk, from = DG.from, moved = DG.moved, item = DG.item;
  DG = null;
  if(!moved || !t) return;

  /* 放进 Dock：只有图标能进，Dock 里不带坐标 */
  if(t.kind === 'dock'){
    if(wk){ toast('卡片放不进 Dock'); return; }
    if(from.kind !== 'dock' && L.dock.length >= 5){ toast('Dock 最多放 5 个'); return; }
    if(from.kind === 'dock') L.dock.splice(from.index, 1);
    else L.screens[from.si].splice(from.index, 1);
    var di = clampIdx(t.index, L.dock.length);
    L.dock.splice(di, 0, id);
    saveLayout(); drawScreens(); drawDock(); gotoScreen(cur);
    animateMove(oldPos);
    return;
  }

  /* 放到桌面某一格 */
  var arrT = L.screens[t.si];
  var skipT = (from.kind === 'screen' && from.si === t.si) ? item : null;

  /* 先试挤位：图标落到有东西的格上，后面的往后串（真手机那种手感） */
  var pushed = false;
  if(!wk){
    var dragItem = item;
    if(from.kind === 'dock'){
      /* 从 Dock 拖回桌面：先造一个带坐标的图标对象再参与串位 */
      dragItem = { t:'a', id:id, x:t.x, y:t.y, w:1, h:1 };
    }
    if(from.kind === 'screen' && from.si !== t.si){
      /* 跨屏：先从来源屏摘掉，再插到目标屏 */
      var srcArr = L.screens[from.si];
      var si0 = srcArr.indexOf(item);
      if(si0 < 0) si0 = from.index;
      srcArr.splice(si0, 1);
    }
    if(pushInsert(t.si, dragItem, t.x, t.y, from)){
      if(from.kind === 'dock') L.dock.splice(from.index, 1);
      pushed = true;
    }else if(from.kind === 'screen' && from.si !== t.si){
      /* 挤位没成，把摘掉的放回去，走下面老逻辑 */
      L.screens[from.si].push(item);
    }
  }

  if(!pushed){
    if(!t.ok){
      /* 目标格被占或放不下：找最近的空位落下，不硬盖别人 */
      var f = findFreeNear(arrT, t.x, t.y, t.w, t.h, skipT);
      if(!f){ toast('这屏放不下了'); return; }
      t.x = f.x; t.y = f.y;
    }

    if(from.kind === 'dock'){
      /* 从 Dock 拖回桌面：变成带坐标的图标 */
      L.dock.splice(from.index, 1);
      L.screens[t.si].push({ t:'a', id:id, x:t.x, y:t.y, w:1, h:1 });
    }else{
      var src = L.screens[from.si];
      var idx = src.indexOf(item);
      if(idx < 0) idx = from.index;
      src.splice(idx, 1);
      item.x = t.x; item.y = t.y;
      L.screens[t.si].push(item);
    }
  }

  saveLayout();
  drawScreens(); drawDock(); gotoScreen(cur);
  animateMove(oldPos);
}

/* ---------- 卡片拉伸 ---------- */
var RZ = null;

function resizeStart(handle, x, y){
  var host = handle.closest('.wg[data-wg]');
  if(!host) return false;
  var pos = locateWG(host.dataset.wg);
  if(!pos) return false;
  var grid = host.closest('.grid');
  if(!grid) return false;
  var gr = grid.getBoundingClientRect();
  var rows = +(grid.dataset.rows || GROW_MIN);
  RZ = {
    el:host, it:pos.it, si:pos.si, grid:grid,
    colw: gr.width / GCOL,
    rowh: gr.height / Math.max(1, rows),
    ox:x, oy:y,
    w0:pos.it.w, h0:pos.it.h,
    w:pos.it.w, h:pos.it.h
  };
  host.classList.add('resizing');
  return true;
}

function resizeMove(x, y){
  if(!RZ) return;
  var dw = Math.round((x - RZ.ox) / Math.max(1, RZ.colw));
  var dh = Math.round((y - RZ.oy) / Math.max(1, RZ.rowh));
  var nw = clamp(RZ.w0 + dw, 1, WMAX);
  var nh = clamp(RZ.h0 + dh, 1, HMAX);
  if(RZ.it.x + nw > GCOL) nw = GCOL - RZ.it.x;
  if(nw < 1) nw = 1;
  if(nw === RZ.w && nh === RZ.h) return;

  var rect = { x:RZ.it.x, y:RZ.it.y, w:nw, h:nh };
  var bad = occupied(L.screens[RZ.si], rect, RZ.it) || !inBounds(rect);
  RZ.el.classList.toggle('badsize', !!bad);
  RZ.w = nw; RZ.h = nh;
  /* 实时预览：只改 CSS，数据等松手才落 */
  RZ.el.style.gridColumn = (RZ.it.x + 1) + ' / span ' + nw;
  RZ.el.style.gridRow = (RZ.it.y + 1) + ' / span ' + nh;
}

function resizeEnd(){
  if(!RZ) return;
  var r = RZ;
  RZ = null;
  r.el.classList.remove('resizing');
  r.el.classList.remove('badsize');

  var rect = { x:r.it.x, y:r.it.y, w:r.w, h:r.h };
  if(r.w === r.w0 && r.h === r.h0){ drawScreens(); gotoScreen(cur); return; }
  if(!inBounds(rect) || occupied(L.screens[r.si], rect, r.it)){
    toast('这么大放不下，挡到别的了');
    drawScreens(); gotoScreen(cur);
    return;
  }
  r.it.w = r.w; r.it.h = r.h;
  saveLayout();
  drawScreens(); gotoScreen(cur);
  toast(r.w + '×' + r.h + ' 格');
}

/* ---------- 挤位动画（FLIP） ----------
   重画前记位置，重画后算差值，先拉回原位再放开，浏览器就画出滑动。 */
function capturePositions(){
  var map = {};
  document.querySelectorAll('.app[data-app],.wg[data-wg]').forEach(function(el){
    var key = el.dataset.app || el.dataset.wg;
    if(!key) return;
    var r = el.getBoundingClientRect();
    map[key] = { x: r.left, y: r.top };
  });
  return map;
}

function animateMove(oldMap){
  if(!oldMap) return;
  var moved = [];
  document.querySelectorAll('.app[data-app],.wg[data-wg]').forEach(function(el){
    var key = el.dataset.app || el.dataset.wg;
    if(!key || !oldMap[key]) return;
    var r = el.getBoundingClientRect();
    var dx = oldMap[key].x - r.left;
    var dy = oldMap[key].y - r.top;
    if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    moved.push(el);
  });
  if(!moved.length) return;
  requestAnimationFrame(function(){
    moved.forEach(function(el){
      el.style.transition = 'transform 0.28s cubic-bezier(0.34, 1.25, 0.64, 1)';
      el.style.transform = '';
    });
    setTimeout(function(){
      moved.forEach(function(el){ el.style.transition = ''; el.style.transform = ''; });
    }, 300);
  });
}

/* ---------- 挤位插入 ----------
   真手机那种感觉：拖到 3 号位，原来的 3 号往后串，1 号 2 号不动。
   做法：把这一屏的图标按阅读顺序（先行后列）拉成一条线，算出目标格是线上第几个，
   把拖的项插进那个下标，再从头铺一遍坐标。
   卡片（t==='w'）不参与串位——它占好几格，跟着串会把整屏搅乱，所以当成固定障碍绕开。 */

/* 按阅读顺序排：y 小的在前，同行 x 小的在前 */
function readOrder(a, b){
  if(a.y !== b.y) return a.y - b.y;
  return a.x - b.x;
}

/* 这一屏被卡片占掉的格子，铺坐标时要跳过 */
/* 把一串元素（图标和卡片）按序顺着铺，尽量紧凑（上推左靠） */
function relayout(elements){
  var set = {}; /* 已铺好的格子 */
  var i = 0;
  for(; i < elements.length; i++){
    var el = elements[i];
    var pw = isWidget(el) ? el.w : 1;
    var ph = isWidget(el) ? el.h : 1;
    var placed = false;
    for(var y = 0; y < 60 && !placed; y++){
      for(var x = 0; x < GCOL && !placed; x++){
        if(x + pw > GCOL) continue; /* 放不下这列 */
        var conflict = false;
        for(var yy = y; yy < y + ph; yy++){
          for(var xx = x; xx < x + pw; xx++){
            if(set[xx + ',' + yy]) conflict = true;
          }
        }
        if(!conflict){
          el.x = x; el.y = y;
          for(var yy = y; yy < y + ph; yy++){
            for(var xx = x; xx < x + pw; xx++){
              set[xx + ',' + yy] = 1;
            }
          }
          placed = true;
        }
      }
    }
    if(!placed) return false; /* 没地放了 */
  }
  return true;
}

/* 目标格 (tx,ty) 在阅读顺序里排第几个：为了能混着排，不再依赖固定格子数，我们按坐标算出位置索引 */
/* 更好的排挤逻辑：不是指定(tx,ty)，而是当把 item 放到(tx,ty)时，它的几何中心落在了哪些元素之间 */
function insertIndexByCoord(arr, tx, ty, w, h){
  /* 将屏幕元素按顺序排好：y小的排前面，y相同x小的排前面 */
  var seq = arr.slice().sort(readOrder);
  var targetY = ty + h/2;
  var targetX = tx + w/2;
  for(var i=0; i<seq.length; i++){
    var cx = seq[i].x + (isWidget(seq[i])?seq[i].w:1)/2;
    var cy = seq[i].y + (isWidget(seq[i])?seq[i].h:1)/2;
    if(cy > targetY) return i;
    if(cy === targetY && cx > targetX) return i;
  }
  return seq.length;
}

/* 挤位落子（重制版：支持卡片和图标混排）*/
function pushInsert(si, item, tx, ty, from){
  var arr = L.screens[si];
  var w = isWidget(item) ? item.w : 1;
  var h = isWidget(item) ? item.h : 1;

  var rest = arr.filter(function(it){ return it !== item; });
  
  /* 原来目标位置如果不被阻挡就可以直接插入到正确序位进行 relayout。
     但是如果有悬空的卡片怎么办？由于重新排布(relayout)是一种彻底的"左上靠拢压缩"流算法，
     只要走了重排，原本为了美观故意留空的"洞"全会被补满。
     不过真手机就是这样的流式自动上推。我们就直接把所有东西拿出来按插入点排序。*/
  
  var idx = insertIndexByCoord(rest, tx, ty, w, h);
  rest.splice(idx, 0, item);
  
  if(!relayout(rest)) return false;

  L.screens[si] = rest;
  return true;
}

function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

/* 从 (x,y) 起向外找最近能放下 w×h 的位置 */
function findFreeNear(arr, x, y, w, h, skip){
  var best = null, bd = Infinity;
  for(var yy=0; yy<40; yy++){
    for(var xx=0; xx+w<=GCOL; xx++){
      var r = { x:xx, y:yy, w:w, h:h };
      if(occupied(arr, r, skip)) continue;
      var dx = xx - x, dy = yy - y;
      var d = dx*dx + dy*dy*1.4;
      if(d < bd){ bd = d; best = { x:xx, y:yy }; }
    }
    /* 已经找到比下一行可能更近的了，就别继续往下扫 */
    if(best && yy > y + 3) break;
  }
  return best;
}

function clampIdx(i, len){
  if(i == null || i < 0) return len;
  return i > len ? len : i;
}

/* 找 id 当前在哪：{kind,si,index} */
function locate(id){
  var di = L.dock.indexOf(id);
  if(di >= 0) return { kind:'dock', si:-1, index:di };
  for(var i=0;i<L.screens.length;i++){
    var arr = L.screens[i];
    for(var j=0;j<arr.length;j++){
      if(isApp(arr[j]) && arr[j].id === id) return { kind:'screen', si:i, index:j };
    }
  }
  return null;
}

var LUNAR_MON = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LUNAR_DAY_1 = ['初','十','廿','三'];
var LUNAR_DAY_2 = ['一','二','三','四','五','六','七','八','九','十'];
var JIEQI = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至',
             '小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
/* 1900-2100 各节气分钟偏移表（压缩），用通用的 minute-offset 方案 */
var JIEQI_BASE = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,
                  263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
/* 公历节日 */
var SOLAR_FEST = {
  '1-1':'元旦','2-14':'情人节','3-8':'妇女节','3-12':'植树节','4-1':'愚人节',
  '5-1':'劳动节','5-4':'青年节','6-1':'儿童节','7-1':'建党节','8-1':'建军节',
  '9-10':'教师节','10-1':'国庆节','12-24':'平安夜','12-25':'圣诞节'
};
/* 农历节日 */
var LUNAR_FEST = {
  '1-1':'春节','1-15':'元宵','2-2':'龙头节','5-5':'端午','7-7':'七夕',
  '7-15':'中元','8-15':'中秋','9-9':'重阳','12-8':'腊八','12-23':'小年'
};

/* 某农历年总天数 */
function lYearDays(y){
  var sum = 348, i;
  for(i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0;
  return sum + leapDays(y);
}
/* 某农历年闰月月份，0 = 无闰 */
function leapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
/* 闰月天数 */
function leapDays(y){
  if(!leapMonth(y)) return 0;
  return (LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29;
}
/* 农历 y 年 m 月天数 */
function monthDays(y, m){
  return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29;
}
/* 公历转农历 */
function solar2lunar(date){
  var offset = Math.floor((date - new Date(1900, 0, 31)) / 86400000);
  var y = 1900, days = 0;
  for(; y < 2101 && offset > 0; y++){
    days = lYearDays(y);
    offset -= days;
  }
  if(offset < 0){ offset += days; y--; }

  var leap = leapMonth(y), isLeap = false, m = 1, md;
  for(; m < 13 && offset > 0; m++){
    if(leap > 0 && m === leap + 1 && !isLeap){
      m--; isLeap = true; md = leapDays(y);
    }else{
      md = monthDays(y, m);
    }
    if(isLeap && m === leap + 1) isLeap = false;
    offset -= md;
  }
  if(offset === 0 && leap > 0 && m === leap + 1){
    if(isLeap){ isLeap = false; }else{ isLeap = true; m--; }
  }
  if(offset < 0){ offset += md; m--; }
  return { y:y, m:m, d:offset + 1, isLeap:isLeap };
}
/* 农历日期转中文 */
function lunarDayText(d){
  if(d === 10) return '初十';
  if(d === 20) return '二十';
  if(d === 30) return '三十';
  return LUNAR_DAY_1[Math.floor(d/10)] + LUNAR_DAY_2[(d%10) - 1];
}
/* 某年某节气是几号 */
function jieqiDay(y, n){
  var base = new Date(Date.UTC(1900, 0, 6, 2, 5));
  var ms = 31556925974.7 * (y - 1900) + JIEQI_BASE[n] * 60000;
  var d = new Date(base.getTime() + ms);
  return d.getUTCDate();
}
/* 这一天该显示什么副标题：优先节日 > 节气 > 农历 */
function dayLabel(date){
  var m = date.getMonth() + 1, d = date.getDate(), y = date.getFullYear();
  var sf = SOLAR_FEST[m + '-' + d];
  if(sf) return { t:sf, fest:true };

  var l = solar2lunar(date);
  if(!l.isLeap){
    var lf = LUNAR_FEST[l.m + '-' + l.d];
    if(lf) return { t:lf, fest:true };
  }
  /* 除夕：腊月最后一天 */
  if(l.m === 12 && l.d === monthDays(l.y, 12)) return { t:'除夕', fest:true };

  /* 节气：每月两个，序号 (m-1)*2 和 (m-1)*2+1 */
  var j1 = jieqiDay(y, (m-1)*2), j2 = jieqiDay(y, (m-1)*2 + 1);
  if(d === j1) return { t:JIEQI[(m-1)*2], jq:true };
  if(d === j2) return { t:JIEQI[(m-1)*2 + 1], jq:true };

  if(l.d === 1) return { t:(l.isLeap ? '闰' : '') + LUNAR_MON[l.m-1] + '月', lunar:true };
  return { t:lunarDayText(l.d), lunar:true };
}

function renderCalendar(body){
  var now = new Date();
  var view = { y:now.getFullYear(), m:now.getMonth() };

  function paint(){
    var y = view.y, m = view.m;
    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var isThisMonth = (y === now.getFullYear() && m === now.getMonth());
    var today = now.getDate();
    /* 上个月尾巴，用来填前面的空格 */
    var prevDays = new Date(y, m, 0).getDate();

    var h = '<div class="card" style="padding:14px 12px 16px">';
    /* 月份头 + 左右翻 */
    h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">' +
           '<button class="btn cal-nav" data-go="-1" style="width:38px;padding:7px 0;margin:0">‹</button>' +
           '<div style="text-align:center">' +
             '<div style="font-size:17px;font-weight:600">' + y + ' 年 ' + (m+1) + ' 月</div>' +
             '<div class="hint" style="font-size:11px;margin-top:2px">' + lunarMonthTitle(y, m) + '</div>' +
           '</div>' +
           '<button class="btn cal-nav" data-go="1" style="width:38px;padding:7px 0;margin:0">›</button>' +
         '</div>';
    if(!isThisMonth){
      h += '<div class="center" style="margin:6px 0 2px">' +
             '<button class="btn" id="cal-today" style="padding:5px 14px;font-size:12px;margin:0">回到今天</button>' +
           '</div>';
    }

    h += '<div class="cal-grid" style="margin-top:10px">';
    ['日','一','二','三','四','五','六'].forEach(function(w, i){
      h += '<div class="cal-wk' + (i === 0 || i === 6 ? ' wknd' : '') + '">' + w + '</div>';
    });
    /* 上月补位 */
    for(var i = first; i > 0; i--){
      h += '<div class="cal-d out"><b>' + (prevDays - i + 1) + '</b></div>';
    }
    /* 本月 */
    for(var d = 1; d <= days; d++){
      var dt = new Date(y, m, d);
      var wd = dt.getDay();
      var lab = dayLabel(dt);
      var on = isThisMonth && d === today;
      var cls = 'cal-d';
      if(on) cls += ' on';
      if(wd === 0 || wd === 6) cls += ' wknd';
      if(lab.fest) cls += ' fest';
      if(lab.jq) cls += ' jq';
      h += '<div class="' + cls + '" data-d="' + d + '">' +
             '<b>' + d + '</b>' +
             '<i>' + lab.t + '</i>' +
           '</div>';
    }
    /* 下月补位，凑满整行 */
    var used = first + days, tail = (7 - used % 7) % 7;
    for(var k = 1; k <= tail; k++){
      h += '<div class="cal-d out"><b>' + k + '</b></div>';
    }
    h += '</div></div>';

    /* 选中那天的详情 */
    var sel = view.sel ? new Date(y, m, view.sel) : (isThisMonth ? now : new Date(y, m, 1));
    var sl = solar2lunar(sel);
    var slab = dayLabel(sel);
    h += '<div class="card">' +
           '<h3>' + (sel.getMonth()+1) + ' 月 ' + sel.getDate() + ' 日</h3>' +
           '<div class="row"><span class="k">星期</span><span class="v">' + weekday(sel) + '</span></div>' +
           '<div class="row"><span class="k">农历</span><span class="v">' +
             (sl.isLeap ? '闰' : '') + LUNAR_MON[sl.m-1] + '月' + lunarDayText(sl.d) + '</span></div>';
    if(slab.fest || slab.jq){
      h += '<div class="row"><span class="k">' + (slab.jq ? '节气' : '节日') + '</span>' +
           '<span class="v" style="color:var(--accent)">' + slab.t + '</span></div>';
    }
    h += '<div class="row"><span class="k">今年第</span><span class="v">' + dayOfYear(sel) + ' 天</span></div>' +
         '<div class="row"><span class="k">本月</span><span class="v">' + days + ' 天</span></div>' +
         '</div>';

    body.innerHTML = h;

    body.querySelectorAll('.cal-nav').forEach(function(b){
      b.onclick = function(){
        var g = +b.dataset.go;
        view.m += g;
        if(view.m < 0){ view.m = 11; view.y--; }
        if(view.m > 11){ view.m = 0; view.y++; }
        view.sel = null;
        paint();
      };
    });
    var tb = body.querySelector('#cal-today');
    if(tb) tb.onclick = function(){
      view.y = now.getFullYear(); view.m = now.getMonth(); view.sel = null; paint();
    };
    body.querySelectorAll('[data-d]').forEach(function(el){
      el.onclick = function(){ view.sel = +el.dataset.d; paint(); };
    });
  }

  /* 月份头那行小字：这个月跨了哪两个农历月 */
  function lunarMonthTitle(y, m){
    var a = solar2lunar(new Date(y, m, 1));
    var b = solar2lunar(new Date(y, m + 1, 0));
    var na = (a.isLeap ? '闰' : '') + LUNAR_MON[a.m-1] + '月';
    var nb = (b.isLeap ? '闰' : '') + LUNAR_MON[b.m-1] + '月';
    return na === nb ? '农历 ' + na : '农历 ' + na + ' - ' + nb;
  }

  paint();
}

function renderNotes(body){
  var K = 'little_phone_notes_v1';
  function read(){ try{ return JSON.parse(localStorage.getItem(K) || '[]'); }catch(e){ return []; } }
  function write(a){ try{ localStorage.setItem(K, JSON.stringify(a)); }catch(e){} }

  function paint(){
    var list = read();
    var h = '<div class="card">' +
              '<input class="ipt" id="nt-in" placeholder="写一句，回车存下来" maxlength="120">' +
              '<button class="btn" id="nt-add">记下来</button>' +
            '</div>';
    if(!list.length){
      h += '<div class="card center hint" style="padding:26px">还空着</div>';
    }else{
      h += '<div class="card"><h3>已记 ' + list.length + ' 条</h3>';
      list.forEach(function(it, i){
        h += '<div class="row"><span class="k" style="flex:1;color:#fff;padding-right:10px">' + esc(it.t) + '</span>' +
             '<span class="v" data-del="' + i + '" style="color:rgba(255,255,255,.35);cursor:pointer">删</span></div>';
      });
      h += '</div>';
    }
    body.innerHTML = h;

    var ipt = body.querySelector('#nt-in');
    function add(){
      var v = (ipt.value || '').trim();
      if(!v){ toast('写点东西再存'); return; }
      var a = read(); a.unshift({ t:v, at:Date.now() }); write(a); paint(); toast('记下了');
    }
    body.querySelector('#nt-add').onclick = add;
    ipt.onkeydown = function(e){ if(e.key === 'Enter') add(); };
    body.querySelectorAll('[data-del]').forEach(function(el){
      el.onclick = function(){
        var a = read(); a.splice(+el.dataset.del, 1); write(a); paint();
      };
    });
  }
  paint();
}

function renderCalc(body){
  var expr = '';
  var keys = ['C','←','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=',''];
  function paint(){
    var h = '<div class="card center" style="padding:22px 16px">' +
              '<div style="min-height:30px;font-size:13px;color:rgba(255,255,255,.45);word-break:break-all">' + (esc(expr) || '0') + '</div>' +
              '<div class="big" id="cc-out" style="font-size:34px;margin-top:6px">' + esc(calc(expr)) + '</div>' +
            '</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px">';
    keys.forEach(function(k){
      if(!k){ h += '<div></div>'; return; }
      h += '<div data-k="' + k + '" style="padding:16px 0;text-align:center;border-radius:15px;' +
           'background:rgba(255,255,255,' + (k === '=' ? '.2' : '.07') + ');font-size:18px;cursor:pointer">' + k + '</div>';
    });
    h += '</div>';
    body.innerHTML = h;
    body.querySelectorAll('[data-k]').forEach(function(el){
      el.onclick = function(){ hit(el.dataset.k); };
    });
  }
  function hit(k){
    if(k === 'C') expr = '';
    else if(k === '←') expr = expr.slice(0, -1);
    else if(k === '=') { var r = calc(expr); expr = (r === '—' ? '' : r); }
    else expr += k;
    paint();
  }
  function calc(s){
    if(!s) return '0';
    var t = s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
    if(!/^[0-9+\-*/.() ]+$/.test(t)) return '—';
    try{
      var v = Function('"use strict";return (' + t + ')')();
      if(typeof v !== 'number' || !isFinite(v)) return '—';
      return String(Math.round(v * 1e10) / 1e10);
    }catch(e){ return '—'; }
  }
  paint();
}

function renderBattery(body){
  function paint(lvl, charging){
    var pct = lvl == null ? '—' : Math.round(lvl * 100) + '%';
    body.innerHTML =
      '<div class="card center" style="padding:32px 18px">' +
        '<div class="bigico">' + icoSVG('battery') + '</div>' +
        '<div class="big" style="font-size:40px">' + pct + '</div>' +
        '<div class="sub">' + (charging ? '正在充电' : '使用电池中') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="row"><span class="k">屏幕</span><span class="v">' + window.innerWidth + ' × ' + window.innerHeight + '</span></div>' +
        '<div class="row"><span class="k">像素比</span><span class="v">' + (window.devicePixelRatio || 1) + '</span></div>' +
        '<div class="row"><span class="k">在线</span><span class="v">' + (navigator.onLine ? '已联网' : '离线') + '</span></div>' +
        '<div class="row"><span class="k">语言</span><span class="v">' + (navigator.language || '—') + '</span></div>' +
      '</div>';
  }
  paint(null, false);
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){ paint(b.level, b.charging); });
  }else if(navigator.battery){
    paint(navigator.battery.level, navigator.battery.charging);
  }
}

  /* 一个底色推出整套：自动生成深浅层次。
     浅底色不能再往白推（往上没空间，四层会挤成一片白灰），也不能整片往下压
     （那样页面比普通白底网页还暗）。做法：bg1 保持你挑的亮度，只把颜色提出来，
     层次靠 3-8 点的极小偏移做，光晕靠饱和度而不是靠压暗。 */
  function setBg(hex){
    var c = rgbOf(hex);
    var isLight = c ? relLum(c) > 0.45 : false;
    if(isLight){
      var base = prepLight(hex);
      TH.bg1 = base;
      TH.bg2 = shift(base, 3);
      TH.bg3 = shift(base, -5);
      TH.glow1 = vividify(base, 160);
      TH.glow2 = vividify(shift(base, -3), 145);
      TH.win = shift(base, 2);
    }else{
      TH.bg1 = hex;
      TH.bg2 = shift(hex, 12);
      TH.bg3 = shift(hex, -6);
      TH.glow1 = shift(hex, 26);
      TH.glow2 = shift(hex, 18);
      TH.win = shift(hex, 4);
    }
    saveTheme(); applyTheme();
  }
  paint();
}

/* 白色里掺一点 hint 的色相：k=1 全白，k=0.8 带两成主题色。
   纯白卡片摆在有色背景上会像贴纸，掺一点才融得进去。 */
function tintWhite(hint, k){
  var c = rgbOf(hint);
  if(!c) return '#ffffff';
  var out = c.map(function(v){ return Math.round(255 * k + v * (1 - k)); });
  return '#' + out.map(function(v){ return ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2); }).join('');
}

/* 背景压一点点给白卡衬底：目标是参考图那种「浅灰底 + 纯白卡」。
   注意 vividify 提饱和度时也会顺带拉低明度，所以压明度那一步要留余量，
   实测压到 236 再提饱和度会掉到 L221，偏暗了；改成只在超过 242 时压，
   且最多压 4，剩下的差距交给饱和度带出来的自然落差。 */
function prepLight(hex){
  var c = rgbOf(hex);
  if(!c) return hex;
  var out = hex;
  var L = Math.round(0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]);
  if(L > 242){
    out = shift(out, -Math.min(4, L - 242));
  }
  for(var i=0;i<8;i++){
    var d = rgbOf(out);
    if(!d) break;
    if(Math.max(d[0],d[1],d[2]) - Math.min(d[0],d[1],d[2]) >= 16) break;
    out = vividify(out, 135);
  }
  /* 提完饱和度如果掉出浅灰区间，补回来：背景不许暗过 230 */
  for(var j=0;j<6;j++){
    var e = rgbOf(out);
    if(!e) break;
    var L2 = Math.round(0.2126*e[0] + 0.7152*e[1] + 0.0722*e[2]);
    if(L2 >= 230) break;
    out = shift(out, Math.min(6, 232 - L2));
  }
  return out;
}

/* 把色号的饱和度按 amt%（100 = 原样，160 = 更浓）推一把，明度保持不变。
   浅色主题三个背景色的通道差只有 6-8，等于加了一丝色的灰白，这是屏幕发灰的根因。 */
function vividify(hex, amt){
  var c = rgbOf(hex);
  if(!c || amt === 100) return hex;
  var k = amt / 100;
  /* 用感知亮度做灰点，绕着它放大色差，灰点不动所以不会变亮变暗 */
  var g = c[0]*0.299 + c[1]*0.587 + c[2]*0.114;
  var out = c.map(function(v){
    var n = g + (v - g) * k;
    return Math.max(0, Math.min(255, Math.round(n)));
  });
  return '#' + out.map(function(v){ return ('0' + v.toString(16)).slice(-2); }).join('');
}

/* 在 bg 底色上找一个够看的墨色：保留 hint 的色相，把明度压到对比够为止。
   白卡底 + 浅色主题时，原来直接拿背景色当线条色，结果白上画白，图标等于消失。 */
function inkOn(bg, hint, want){
  var b = rgbOf(bg), c = rgbOf(hint);
  var goal = want || 4.2;
  if(!b) b = [255,255,255];
  if(!c) c = [40,44,52];
  /* 色相保住，整体压暗，最多压 12 轮 */
  for(var i=0;i<12;i++){
    if(contrast(b, c) >= goal) break;
    c = [Math.round(c[0]*0.78), Math.round(c[1]*0.78), Math.round(c[2]*0.78)];
    if(c[0] + c[1] + c[2] < 24) break;
  }
  return '#' + c.map(function(v){ return ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2); }).join('');
}
function rgbOf(hex){
  var h = String(hex).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length !== 6) return null;
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  if(isNaN(r) || isNaN(g) || isNaN(b)) return null;
  return [r,g,b];
}
function relLum(c){
  var a = c.map(function(v){
    v /= 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return a[0]*0.2126 + a[1]*0.7152 + a[2]*0.0722;
}
function contrast(c1, c2){
  var l1 = relLum(c1), l2 = relLum(c2);
  var hi = Math.max(l1, l2), lo = Math.min(l1, l2);
  return (hi + 0.05) / (lo + 0.05);
}

/* 把色号整体提亮/压暗 amt 个百分点。
   提亮不再是每个通道加同一个常数（浅色底会一起撞到 255，色彩被削平成纯白），
   改成按各通道到端点的剩余空间成比例走，色相就能保住。 */
function shift(hex, amt){
  var h = String(hex).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length !== 6) return hex;
  var k = Math.max(-100, Math.min(100, amt)) / 100;
  var out = '#';
  for(var i=0;i<3;i++){
    var v = parseInt(h.substr(i*2,2),16);
    if(isNaN(v)) return hex;
    /* k>0 往 255 走，k<0 往 0 走，都按自身剩余空间的比例，不会封顶压平 */
    var n = k >= 0 ? v + (255 - v) * k : v * (1 + k);
    n = Math.round(n);
    if(n < 0) n = 0; if(n > 255) n = 255;
    out += ('0' + n.toString(16)).slice(-2);
  }
  return out;
}

/* 壁纸小预览的背景值 */
function wpPreview(k){
  var base = thv('bg1');
  if(k === 'none') return 'linear-gradient(140deg,' + shift(base,14) + ',' + base + ')';
  if(k === 'custom'){
    var d = loadWP();
    return d ? 'center/cover no-repeat url("' + d + '")' : 'linear-gradient(140deg,#5a6070,#2a2f3a)';
  }
  var c2 = shift(base, 24);
  if(k === 'dots') return base + ' radial-gradient(' + c2 + ' 1.6px, transparent 1.7px) 0 0/9px 9px repeat';
  if(k === 'grid') return base + ' linear-gradient(' + c2 + ' 1px, transparent 1px) 0 0/10px 10px repeat';
  if(k === 'lines') return base + ' repeating-linear-gradient(45deg,' + c2 + ' 0 1.2px, transparent 1.2px 7px)';
  if(k === 'blob') return 'radial-gradient(70% 60% at 25% 20%,' + shift(base,32) + ' 0%, transparent 65%),linear-gradient(160deg,' + shift(base,-5) + ',' + base + ')';
  return base;
}

/* 把用户挑的图压到能塞进 localStorage 的尺寸 */
function shrinkImage(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb('', true); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb('', true); };
    img.onload = function(){
      var maxW = 900, maxH = 1800;
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ cb('', true); return; }
      var s = Math.min(1, maxW / w, maxH / h);
      var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
      var q = 0.78, out = '';
      try{
        out = cv.toDataURL('image/jpeg', q);
        /* 超过 1.6M 就再降质量，最多降三次 */
        var n = 0;
        while(out.length > 1600000 && n < 3){ q -= 0.16; out = cv.toDataURL('image/jpeg', q); n++; }
      }catch(e){ cb('', true); return; }
      cb(out, false);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* 只读成 Image 对象，不压不裁，交给裁剪器 */
function readImage(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb(null, true); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null, true); };
    img.onload = function(){
      if(!(img.naturalWidth || img.width)){ cb(null, true); return; }
      cb(img, false);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- 裁剪器 ----------
   全屏盖一层，图片铺满可视区，上面浮一个按卡片比例的取景框。
   手指拖图移位置，双指捏合缩放，框不动。确定时按框映射回原图裁出来。 */
function openCropper(img, ratio, done){
  if(!ratio || !isFinite(ratio) || ratio <= 0) ratio = 1;

  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;

  var wrap = document.createElement('div');
  wrap.id = 'cropper';
  wrap.innerHTML =
    '<div class="cptop">拖动挪位置，两指捏合缩放</div>' +
    '<div class="cpstage"><canvas class="cpcv"></canvas>' +
      '<div class="cpmaskbox"><div class="cpframe"></div></div>' +
    '</div>' +
    '<div class="cpbar">' +
      '<button class="btn" data-cp="cancel">取消</button>' +
      '<button class="btn" data-cp="fit">铺满</button>' +
      '<button class="btn cpok" data-cp="ok">就这块</button>' +
    '</div>';
  document.body.appendChild(wrap);

  var stage = wrap.querySelector('.cpstage');
  var cv = wrap.querySelector('.cpcv');
  var frameEl = wrap.querySelector('.cpframe');
  var ctx = cv.getContext('2d');

  /* 取景框：居中，按 ratio 塞进舞台里，留点边 */
  var F = { x:0, y:0, w:0, h:0 };
  /* 图在画布上的位置和缩放 */
  var V = { s:1, x:0, y:0 };

  function layout(){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if(!sw || !sh) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(sw * dpr);
    cv.height = Math.round(sh * dpr);
    cv.style.width = sw + 'px';
    cv.style.height = sh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var availW = sw - 28, availH = sh - 28;
    var fw = availW, fh = fw / ratio;
    if(fh > availH){ fh = availH; fw = fh * ratio; }
    F.w = fw; F.h = fh;
    F.x = (sw - fw) / 2;
    F.y = (sh - fh) / 2;
    frameEl.style.left = F.x + 'px';
    frameEl.style.top = F.y + 'px';
    frameEl.style.width = F.w + 'px';
    frameEl.style.height = F.h + 'px';
  }

  /* 缩放到刚好盖住取景框 */
  function minScale(){ return Math.max(F.w / iw, F.h / ih); }

  function fitCover(){
    V.s = minScale();
    V.x = F.x + (F.w - iw * V.s) / 2;
    V.y = F.y + (F.h - ih * V.s) / 2;
  }

  /* 不许把框露出图外 */
  function clampView(){
    var ms = minScale();
    if(V.s < ms) V.s = ms;
    var dw = iw * V.s, dh = ih * V.s;
    if(V.x > F.x) V.x = F.x;
    if(V.y > F.y) V.y = F.y;
    if(V.x + dw < F.x + F.w) V.x = F.x + F.w - dw;
    if(V.y + dh < F.y + F.h) V.y = F.y + F.h - dh;
  }

  function draw(){
    clampView();
    var sw = cv.clientWidth, sh = cv.clientHeight;
    ctx.clearRect(0, 0, sw, sh);
    ctx.fillStyle = '#0b0b0d';
    ctx.fillRect(0, 0, sw, sh);
    ctx.drawImage(img, V.x, V.y, iw * V.s, ih * V.s);
  }

  layout();
  fitCover();
  draw();

  /* 手势 */
  var mode = 0;  // 1=拖 2=捏
  var last = null, pinch0 = 0, s0 = 1, mid0 = null;

  function pts(e){
    var out = [];
    if(e.touches){
      for(var i=0;i<e.touches.length;i++) out.push({ x:e.touches[i].clientX, y:e.touches[i].clientY });
    }else{
      out.push({ x:e.clientX, y:e.clientY });
    }
    return out;
  }
  function rel(p){
    var r = cv.getBoundingClientRect();
    return { x:p.x - r.left, y:p.y - r.top };
  }
  function dist(a, b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

  function down(e){
    var p = pts(e);
    if(p.length >= 2){
      mode = 2;
      pinch0 = dist(p[0], p[1]);
      s0 = V.s;
      mid0 = rel({ x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2 });
    }else{
      mode = 1;
      last = rel(p[0]);
    }
    if(e.cancelable) e.preventDefault();
  }
  function move(e){
    if(!mode) return;
    var p = pts(e);
    if(mode === 2 && p.length >= 2){
      var d = dist(p[0], p[1]);
      if(pinch0 > 0){
        var ns = s0 * (d / pinch0);
        var ms = minScale();
        if(ns < ms) ns = ms;
        if(ns > ms * 8) ns = ms * 8;
        /* 以两指中点为锚点缩放 */
        var k = ns / V.s;
        V.x = mid0.x - (mid0.x - V.x) * k;
        V.y = mid0.y - (mid0.y - V.y) * k;
        V.s = ns;
        draw();
      }
    }else if(mode === 1 && p.length){
      var c = rel(p[0]);
      V.x += c.x - last.x;
      V.y += c.y - last.y;
      last = c;
      draw();
    }
    if(e.cancelable) e.preventDefault();
  }
  function up(){ mode = 0; last = null; }

  ['touchstart','mousedown'].forEach(function(ev){ cv.addEventListener(ev, down, { passive:false }); });
  ['touchmove','mousemove'].forEach(function(ev){ cv.addEventListener(ev, move, { passive:false }); });
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(ev){ cv.addEventListener(ev, up, { passive:true }); });

  /* 滚轮缩放，桌面上好用 */
  cv.addEventListener('wheel', function(e){
    e.preventDefault();
    var c = rel({ x:e.clientX, y:e.clientY });
    var ms = minScale();
    var ns = V.s * (e.deltaY < 0 ? 1.12 : 0.89);
    if(ns < ms) ns = ms;
    if(ns > ms * 8) ns = ms * 8;
    var k = ns / V.s;
    V.x = c.x - (c.x - V.x) * k;
    V.y = c.y - (c.y - V.y) * k;
    V.s = ns;
    draw();
  }, { passive:false });

  function close(){
    window.removeEventListener('resize', onResize);
    if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
  }
  function onResize(){
    layout(); clampView(); draw();
  }
  window.addEventListener('resize', onResize);

  /* 取景框对应原图的哪块，裁出来再压 */
  function cut(){
    var sx = (F.x - V.x) / V.s;
    var sy = (F.y - V.y) / V.s;
    var sw = F.w / V.s;
    var sh = F.h / V.s;
    sx = Math.max(0, Math.min(sx, iw));
    sy = Math.max(0, Math.min(sy, ih));
    sw = Math.max(1, Math.min(sw, iw - sx));
    sh = Math.max(1, Math.min(sh, ih - sy));

    /* 输出尺寸：长边最多 900，保持取景比例 */
    var outW = sw, outH = sh;
    var cap = 900;
    var k = Math.min(1, cap / Math.max(outW, outH));
    outW = Math.max(1, Math.round(outW * k));
    outH = Math.max(1, Math.round(outH * k));

    var oc = document.createElement('canvas');
    oc.width = outW; oc.height = outH;
    var octx = oc.getContext('2d');
    octx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
    var q = 0.82, out = '';
    try{
      out = oc.toDataURL('image/jpeg', q);
      var n = 0;
      while(out.length > 1600000 && n < 4){ q -= 0.15; out = oc.toDataURL('image/jpeg', q); n++; }
    }catch(e){ return null; }
    return out;
  }

  wrap.addEventListener('click', function(e){
    var b = e.target.closest('[data-cp]');
    if(!b) return;
    var act = b.dataset.cp;
    if(act === 'cancel'){ close(); return; }
    if(act === 'fit'){ fitCover(); draw(); return; }
    if(act === 'ok'){
      var out = cut();
      close();
      if(!out){ toast('裁的时候出错了'); return; }
      done(out);
    }
  });
}

var WXICO = {

};

var wxStack = [];              /* 导航栈，每项 { page, arg, title, sub } */
var WX_TABS = ['chats','contacts','me'];
var wxTab = 'chats';

function wxOpen(){
  document.getElementById('wx').classList.add('open');
  wxStack = [];
  wxGo('chats');
}
function wxClose(){
  document.getElementById('wx').classList.remove('open');
  wxPopClose();
}
function wxPopClose(){ document.getElementById('wx-pop').classList.remove('on'); }

/* 进一个页面：压栈再画 */
function wxGo(page, arg){
  wxStack.push({ page:page, arg:arg });
  wxPaint();
}
/* 返回：栈里只剩一层就退出微信 */
function wxBack(){
  wxPopClose();
  if(wxStack.length <= 1){ wxClose(); return; }
  wxStack.pop();
  wxPaint();
}
/* 切 tab：把栈清成一层，tab 之间不互相叠 */
function wxSwitch(tab){
  wxTab = tab;
  wxStack = [{ page:tab }];
  wxPaint();
}

var WXPAGE = {};   /* page → { title, tabs, plus, render } */

function wxPaint(){
  var top = wxStack[wxStack.length - 1];
  if(!top){ wxClose(); return; }
  var def = WXPAGE[top.page];
  if(!def){ toast('这页还没做'); wxBack(); return; }

  var view = document.getElementById('wx-view');
  var tabs = document.getElementById('wx-tabs');
  var plus = document.getElementById('wx-act');
  var act2 = document.getElementById('wx-act2');
  var sub  = document.getElementById('wx-sub');

  wxPopClose();
  view.innerHTML = '';
  view.className = 'wx-body' + (def.gray ? ' gray' : '');
  view.scrollTop = 0;
  sub.style.display = 'none';
  act2.style.display = 'none';

  /* 标题：可以是字符串，也可以是拿 arg 算出来的函数 */
  var t = (typeof def.title === 'function') ? def.title(top.arg) : def.title;
  document.getElementById('wx-title').textContent = t || '微信';

  /* 底部 tab 只在三个主页面显示 */
  if(def.tabs){
    tabs.style.display = 'flex';
    tabs.innerHTML =
      wxTabBtn('chats',    '微信',   WXICO.chat) +
      wxTabBtn('contacts', '通讯录', WXICO.cont) +
      wxTabBtn('me',       '我',     WXICO.me);
  }else{
    tabs.style.display = 'none';
  }

  /* 右上角按钮：有 plus 定义就显示，点开弹菜单 */
  if(def.plus){
    plus.style.display = 'flex';
    plus.textContent = def.plusIcon || '＋';
  }else{
    plus.style.display = 'none';
  }

  def.render(view, top.arg);
}

function wxTabBtn(id, name, path){
  return '<div class="wx-tab' + (wxTab === id ? ' on' : '') + '" data-tab="' + id + '">' +
    '<svg viewBox="0 0 24 24">' + path + '</svg><span>' + name + '</span></div>';
}

/* 头像：有图用图，没图用名字首字＋按 id 定色 */
function wxAva(c, cls){
  var nm = (c && c.name) ? c.name : '?';
  var ava = c && c.ava;
  var st = '';
  if(ava) st = ' style="background-image:url(' + ava + ')"';
  else st = ' style="background:' + wxColorOf((c && c.id) || nm) + '"';
  return '<div class="wx-ava' + (cls ? ' ' + cls : '') + '"' + st + '>' +
    (ava ? '' : esc(nm.slice(0,1))) + '</div>';
}
function wxColorOf(seed){
  var s = String(seed), n = 0;
  for(var i=0;i<s.length;i++) n = (n * 31 + s.charCodeAt(i)) % 360;
  return 'hsl(' + n + ',42%,62%)';
}

/* 时间显示：今天只给时分，昨天给「昨天」，更早给日期 */
function wxTime(ts){
  if(!ts) return '';
  var d = new Date(ts), n = new Date();
  var sameDay = d.toDateString() === n.toDateString();
  if(sameDay) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  var y = new Date(n.getTime() - 86400000);
  if(d.toDateString() === y.toDateString()) return '昨天';
  return (d.getMonth()+1) + '/' + d.getDate();
}

/* 会话列表里那行预览文字 */
function wxPreview(id){
  var a = CHAT[id];
  if(!a || !a.length) return '';
  var m = a[a.length - 1];
  var body = (m.kind === 'voice') ? '[语音]' : (m.t || '');
  return (m.r === 'me' ? '我: ' : '') + body;
}
function wxLastTs(id){
  var a = CHAT[id];
  return (a && a.length) ? (a[a.length-1].ts || 0) : 0;
}

/* ---------- 挑图：压到指定边长再转 dataURL ---------- */
function wxPickImage(cb, maxSide){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var m = maxSide || 220;
        var w = img.width, h = img.height;
        var s = Math.min(1, m / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * s));
        cv.height = Math.max(1, Math.round(h * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        try{ cb(cv.toDataURL('image/jpeg', 0.82)); }
        catch(e){ toast('这张图处理不了，换一张'); }
      };
      img.onerror = function(){ toast('这张图读不出来'); };
      img.src = fr.result;
    };
    fr.onerror = function(){ toast('文件读失败'); };
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* ---------- 微信事件：一处代理，别到处挂 onclick ---------- */
function wxBindOnce(){
  var wx = document.getElementById('wx');

  document.getElementById('wx-back').onclick = wxBack;

  /* 右上角 ＋：按当前页弹不同菜单 */
  document.getElementById('wx-act').onclick = function(e){
    e.stopPropagation();
    var pop = document.getElementById('wx-pop');
    if(pop.classList.contains('on')){ wxPopClose(); return; }
    var top = wxStack[wxStack.length - 1];
    var items = [];
    if(top.page === 'chats' || top.page === 'contacts'){
      items = [
        { go:'addman', t:'＋ 手动加好友' },
        { go:'match',  t:'⚲ 随机匹配陌生人' },
        { go:'chars',  t:'▤ 角色档案' }
      ];
    }else if(top.page === 'chars'){
      items = [{ go:'addman', t:'＋ 新建角色' }];
    }
    if(!items.length){ toast('这页没有可加的'); return; }
    pop.innerHTML = items.map(function(i){
      return '<div class="it" data-go="' + i.go + '">' + i.t + '</div>';
    }).join('');
    pop.classList.add('on');
  };

  /* 统一点击代理：data-chat 进聊天、data-card 看资料、data-edit 改人、data-go 跳页 */
  wx.addEventListener('click', function(e){
    var tb = e.target.closest ? e.target.closest('[data-tab]') : null;
    if(tb){ wxSwitch(tb.dataset.tab); return; }

    var el = e.target.closest ? e.target.closest('[data-go],[data-chat],[data-card],[data-edit]') : null;
    if(!el){ wxPopClose(); return; }

    if(el.dataset.chat){
      /* 聊天窗口是第二块的活，先给个明话，不装能用 */
      if(WXPAGE.chat){ wxGo('chat', el.dataset.chat); }
      else toast('聊天窗口是下一块，马上做');
      return;
    }
    if(el.dataset.card){ wxGo('card', el.dataset.card); return; }
    if(el.dataset.edit){ wxGo('edit', el.dataset.edit); return; }

    var go = el.dataset.go;
    if(go === 'addman'){ wxPopClose(); wxGo('edit', null); return; }
    if(go === 'moments' && !WXPAGE.moments){ toast('朋友圈在第四块'); return; }
    if(go === 'match' && !WXPAGE.match){ toast('随机匹配要先配好聊天 API'); return; }
    wxPopClose();
    wxGo(go);
  });
}

function openSheet(si, cx, cy){

  document.getElementById('mask').classList.add('on');

  document.getElementById('mask').classList.remove('on');

/* 要往 si 屏放一个 w×h，落点优先用点过的那一格 */
function pickSpot(si, w, h){
  var arr = L.screens[si] || [];
  var want = sheetAt ? { x:sheetAt.x, y:sheetAt.y, w:w, h:h } : null;
  if(want){
    if(want.x + w > GCOL) want.x = Math.max(0, GCOL - w);
    if(inBounds(want) && !occupied(arr, want, null)) return { x:want.x, y:want.y };
    var near = findFreeNear(arr, want.x, want.y, w, h, null);
    if(near) return near;
  }
  return findFree(arr, w, h, null);
}

function pickApp(si){
  var used = {};
  L.screens.forEach(function(s){ s.forEach(function(it){ if(isApp(it)) used[it.id] = 1; }); });
  L.dock.forEach(function(id){ used[id] = 1; });

  var spot = pickSpot(si, 1, 1);
  var free = Object.keys(REG).filter(function(id){ return !used[id]; });
  var h = '';
  if(!free.length){
    h = '<div class="card center hint" style="padding:26px">应用都装上了。想要新的就告诉我，我去写。</div>';
  }else{
    h = '<div class="card"><h3>点一个装到第 ' + (si + 1) + ' 屏</h3>';
    free.forEach(function(id){
      h += '<div class="row" data-pick="' + id + '" style="cursor:pointer">' +
           '<span class="k" style="color:inherit;display:flex;align-items:center;gap:10px"><span class="miniico">' + icoSVG(REG[id].icon) + '</span>' + esc(appName(id)) + '</span>' +
           '<span class="v" style="color:rgba(255,255,255,.35)">' + (REG[id].render ? '能用' : '占位') + '</span></div>';
    });
    h += '</div>';
  }
  var body = openWin('装应用', h);
  body.querySelectorAll('[data-pick]').forEach(function(el){
    el.onclick = function(){
      var id = el.dataset.pick;
      L.screens[si].push({ t:'a', id:id, x:spot.x, y:spot.y, w:1, h:1 });
      saveLayout(); drawScreens(); gotoScreen(si); closeWin();
      toast(REG[id].name + ' 装好了');
    };
  });
}

  function paint(){
    var d = wgData(k);
    var h = '';

    h += '<div class="card center" style="padding:18px 16px">';
    if(it.w2 === 'pairw'){
      /* 情侣卡预览：直接把两个头像圈摆出来，比一个大图标有用 */
      h += '<div class="pw-avatars" style="max-width:190px;margin:0 auto">';
      [1, 2].forEach(function(n){
        if(n === 2) h += pwLinkHTML();
        var cur = d['img' + n] || '';
        h += '<div class="pw-ava">';
        h += '<div class="pw-ava-in">' +
               (cur ? '<div class="pw-ava-img" style="background-image:url(\'' + cur + '\')"></div>'
                    : '<div class="pw-ava-ph">空</div>') +
             '</div>';
        h += '</div>';
      });
      h += '</div>';
    }else if(d.img){
      h += '<div style="height:120px;border-radius:14px;background:center/cover no-repeat url(\'' + d.img + '\')"></div>';
    }else{
      h += '<div class="bigico">' + icoSVG(it.w2 === 'clockw' ? 'clock' : ((it.w2 === 'datew' || it.w2 === 'calw') ? 'calendar' : (it.w2 === 'note' ? 'notes' : 'photos'))) + '</div>';
    }
    h += '<div class="sub" style="margin-top:10px">' + kind.name + ' · ' + it.w + '×' + it.h + ' 格</div>';

    /* 自由卡因为渲染自己完全管，不需要整卡的那个基础图片。把底部的这个大图区收了 */
    if(it.w2 !== 'pairw' && it.w2 !== 'free'){
      h += '<div class="card"><h3>图片</h3>';
      h += '<button class="btn" id="wg-pick">' + (d.img ? '换一张' : '挑一张图') + '</button>';
      if(d.img){
        h += '<button class="btn" id="wg-crop" style="margin-top:9px">裁一下这张图</button>';
        h += '<button class="btn" id="wg-imgclr" style="margin-top:9px">去掉图片</button>';

      h += '<input type="file" id="wg-file" accept="image/*" style="display:none">';

    if(it.w2 === 'frame'){
      h += '<div class="card"><h3>文字</h3>' +

    }else if(it.w2 === 'note'){
      h += '<div class="card"><h3>写点什么</h3>' +

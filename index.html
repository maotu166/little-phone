        '<button class="btn" id="wg-save" style="margin-top:9px">存好</button>' +
        '</div>';
    }else if(it.w2 === 'photo'){
      h += '<div class="card"><h3>角落小字</h3>' +
        '<input class="ipt" id="wg-text" maxlength="20" placeholder="不写就只有图" value="' + esc(d.text || '') + '">' +
        '<button class="btn" id="wg-save" style="margin-top:9px">存好</button>' +
        '</div>';
    }else if(it.w2 === 'pairw'){
      /* 情侣卡：两个头像各自一套按钮，独立存 img1/img2；歌词自己输入 */
      h += '<div class="card"><h3>两个头像</h3>';
      [1, 2].forEach(function(n){
        var cur = d['img' + n] || '';
        h += '<div style="margin-top:' + (n === 1 ? '0' : '12px') + '">';
        h += '<div class="sub">头像 ' + n + (cur ? '' : ' · 还是空的') + '</div>';
        h += '<button class="btn" data-pwpick="' + n + '" style="margin-top:7px">' +
               (cur ? '换一张' : '挑一张图') + '</button>';
        if(cur){
          h += '<button class="btn" data-pwclr="' + n + '" style="margin-top:7px">去掉这张</button>';
        }
        h += '</div>';
      });
      h += '<input type="file" id="pw-avafile" accept="image/*" style="display:none">';
      h += '<div class="hint" style="margin-top:9px">头像按 1:1 裁，裁成方的才填得满圆圈。</div>';
      h += '</div>';
      h += '<div class="card"><h3>对话框</h3>' +
        '<input class="ipt" id="wg-say1" maxlength="6" placeholder="左边说什么" value="' + esc(d.say1 || '') + '">' +
        '<input class="ipt" id="wg-say2" maxlength="6" placeholder="右边说什么" value="' + esc(d.say2 || '') + '" style="margin-top:9px">' +
        '<div class="hint" style="margin-top:9px">三四个字最好看，比如「喜欢你」「讨厌你」。留空就不显示这个气泡。</div>' +
        '</div>';
      h += '<div class="card"><h3>小颜文字</h3>' +
        '<input class="ipt" id="wg-kao1" maxlength="8" placeholder="左边的颜文字" value="' + esc(d.kao1 || '') + '">' +
        '<input class="ipt" id="wg-kao2" maxlength="8" placeholder="右边的颜文字" value="' + esc(d.kao2 || '') + '" style="margin-top:9px">' +
        '<div class="hint" style="margin-top:9px">挂在头像右下角的小气泡，比如 ^ω^ 和 &gt;ㅅ&lt; 。留空就不显示。</div>' +
        '</div>';
      h += '<div class="card"><h3>歌名和歌词</h3>' +
        '<input class="ipt" id="wg-song" maxlength="16" placeholder="歌名（显示在播放器那行）" value="' + esc(d.song || '') + '">' +
        '<input class="ipt" id="wg-lyric1" maxlength="24" placeholder="第一行歌词" value="' + esc(d.lyric1 || '') + '" style="margin-top:9px">' +
        '<input class="ipt" id="wg-lyric2" maxlength="24" placeholder="第二行歌词" value="' + esc(d.lyric2 || '') + '" style="margin-top:9px">' +
        '<button class="btn" id="wg-save" style="margin-top:9px">存好</button>' +
        '<div class="hint" style="margin-top:9px">歌名留空显示「未知歌曲」。两行歌词都留空就不显示歌词。这些和气泡一起存。</div>' +
        '</div>';
      /* 整卡背景图：铺在最底层，播放器/歌词/头像都压在它上面 */
      h += '<div class="card"><h3>背景图</h3>';
      h += '<div class="pwbgbox">' +
             (d.bg ? '<img class="pwbgpv" src="' + d.bg + '">' : '<div class="pwbgpv empty">还没有背景图</div>') +
           '</div>';
      h += '<button class="btn" id="pw-bgpick" style="margin-top:9px">挑一张背景图</button>';
      if(d.bg){
        h += '<button class="btn" id="pw-bgcrop" style="margin-top:7px">重新裁一下</button>';
        h += '<button class="btn" id="pw-bgclr" style="margin-top:7px">去掉背景图</button>';
      }
      h += '<input type="file" id="pw-bgfile" accept="image/*" style="display:none">';
      h += '<div class="hint" style="margin-top:9px">按卡片当前形状裁。背景垫在最底层，不会挡住歌词、播放器和头像。</div>';
      h += '</div>';
    }

    if(it.w2 === 'music'){
      /* 音乐卡：CD封面 + 歌名歌词 */
      h += '<div class="card"><h3>CD封面</h3>';
      h += '<div class="pwbgbox">' +
             (d.cd ? '<img class="pwbgpv" src="' + d.cd + '">' : '<div class="pwbgpv empty">还没挑封面</div>') +
           '</div>';
      h += '<button class="btn" id="mw-cdpick" style="margin-top:9px">' + (d.cd ? '换一张' : '挑一张图') + '</button>';
      if(d.cd) h += '<button class="btn" id="mw-cdclr" style="margin-top:7px">去掉封面</button>';
      h += '<input type="file" id="mw-cdfile" accept="image/*" style="display:none">';
      h += '<div class="hint" style="margin-top:9px">按 1:1 裁成方的，会自动切圆并且一直慢慢转。</div>';
      h += '</div>';
      h += '<div class="card"><h3>歌名和歌词</h3>' +
        '<input class="ipt" id="mw-song" maxlength="16" placeholder="歌名" value="' + esc(d.song || '') + '">' +
        '<input class="ipt" id="mw-lyric1" maxlength="20" placeholder="第一行歌词" value="' + esc(d.lyric1 || '') + '" style="margin-top:9px">' +
        '<input class="ipt" id="mw-lyric2" maxlength="20" placeholder="第二行歌词" value="' + esc(d.lyric2 || '') + '" style="margin-top:9px">' +
        '<button class="btn" id="mw-save" style="margin-top:9px">存好</button>' +
        '<div class="hint" style="margin-top:9px">歌名留空显示「未知歌曲」。歌词留空就不显示那一行。</div>' +
        '</div>';
    }

    if(it.w2 === 'free'){
      /* 自由卡的图层编辑器入口 */
      h += '<div class="card"><h3>图层组装</h3>';
      h += '<button class="btn" id="free-edit">去拼图层</button>';
      h += '<div class="hint" style="margin-top:9px">进去以后可以加字、加图、自由摆放</div>';
      h += '</div>';
    }

    /* 单卡单独设置圆角 */
    h += '<div class="card"><h3>圆角</h3>';
    h += '<div style="display:flex;align-items:center;gap:12px">';
    h += '<input type="range" id="wg-radius" min="0" max="60" step="1" value="' + (d.r != null ? d.r : 17) + '" style="flex:1">';
    h += '<div id="wg-radius-val" style="width:36px;text-align:right;font-size:14px;opacity:0.8">' + (d.r != null ? d.r : 17) + '</div>';
    h += '</div>';
    h += '<div class="hint" style="margin-top:9px">左右滑动可以把这张卡改成你想要的圆度。默认是 17，改成 0 就是直角。</div>';
    h += '</div>';

    /* 大小：自由调 + 预设快捷 */
    h += '<div class="card"><h3>大小</h3>';
    h += '<div class="szrow"><span class="k">宽</span><div class="szbtns" data-axis="w">';
    for(var w=1; w<=WMAX; w++){
      h += '<button class="szb' + (it.w === w ? ' on' : '') + '" data-w="' + w + '">' + w + '</button>';
    }
    h += '</div></div>';
    h += '<div class="szrow" style="margin-top:8px"><span class="k">高</span><div class="szbtns" data-axis="h">';
    for(var hh2=1; hh2<=HMAX; hh2++){
      h += '<button class="szb' + (it.h === hh2 ? ' on' : '') + '" data-h="' + hh2 + '">' + hh2 + '</button>';
    }
    h += '</div></div>';
    h += '<div class="hint" style="margin-top:9px">1 到 4 格随便配，共 16 种。也能在桌面整理态直接拽卡片右下角。</div>';

    Object.keys(WSIZE).forEach(function(sk){
      var s = WSIZE[sk];
      var on = (it.w === s.cols && it.h === s.rows);
      h += '<div class="thm' + (on ? ' on' : '') + '" data-size="' + sk + '">' +
             '<div class="tx">' + s.name + '<small>' + sk + ' 格 · ' + s.sub + '</small></div>' +
           '</div>';
    });
    h += '</div></div>';

    h += '<div class="card"><button class="btn" id="wg-del" style="background:rgba(255,90,90,.16)">删掉这张卡片</button></div>';

    body.innerHTML = h;
    wire();
  }

  function redraw(){
    saveLayout(); drawScreens(); drawDock(); gotoScreen(cur);
  }

  /* 改尺寸，放不下就说清楚而不是硬盖 */
  function setSize(nw, nh){
    var arr = L.screens[pos.si];
    var x = it.x;
    if(x + nw > GCOL) x = GCOL - nw;
    if(x < 0) x = 0;
    var rect = { x:x, y:it.y, w:nw, h:nh };
    if(!inBounds(rect) || occupied(arr, rect, it)){
      var f = findFreeNear(arr, it.x, it.y, nw, nh, it);
      if(!f){ toast('这屏放不下 ' + nw + '×' + nh); return false; }
      rect.x = f.x; rect.y = f.y;
    }
    it.x = rect.x; it.y = rect.y; it.w = nw; it.h = nh;
    redraw(); paint();
    toast(nw + '×' + nh + ' 格');
    return true;
  }

  function wire(){
    var rad = body.querySelector('#wg-radius');
    var radV = body.querySelector('#wg-radius-val');
    if(rad){
      rad.oninput = function(){ radV.innerText = this.value; };
      rad.onchange = function(){
        wgData(k).r = parseInt(this.value, 10);
        if(!saveWG()){ toast('存不下了'); return; }
        redraw(); paint();
      };
    }

    var btnFree = body.querySelector('#free-edit');
    if(btnFree){
      btnFree.onclick = function(){
        openFreeEditor(k);
      };
    }

    /* 音乐卡：CD 封面（1:1 裁）＋ 歌名歌词 */
    var mcf = body.querySelector('#mw-cdfile');
    if(mcf){
      var mcpick = body.querySelector('#mw-cdpick');
      if(mcpick) mcpick.onclick = function(){ mcf.click(); };
      mcf.onchange = function(){
        var file = this.files && this.files[0];
        if(!file) return;
        this.value = '';
        toast('在读图片…');
        readImage(file, function(img, err){
          if(err){ toast('这张图读不了'); return; }
          openCropper(img, 1, function(dataUrl){
            var dd = wgData(k);
            var old = dd.cd;
            dd.cd = dataUrl;
            if(!saveWG()){
              if(old) dd.cd = old; else delete dd.cd;
              saveWG();
              toast('存不下了，图太多或太大');
              return;
            }
            redraw(); paint(); toast('封面换好了');
          });
        });
      };
      var mcclr = body.querySelector('#mw-cdclr');
      if(mcclr) mcclr.onclick = function(){
        delete wgData(k).cd;
        saveWG(); redraw(); paint(); toast('封面去掉了');
      };
    }
    var msave = body.querySelector('#mw-save');
    if(msave){
      msave.onclick = function(){
        var dd = wgData(k);
        dd.song   = (body.querySelector('#mw-song').value || '').trim();
        dd.lyric1 = (body.querySelector('#mw-lyric1').value || '').trim();
        dd.lyric2 = (body.querySelector('#mw-lyric2').value || '').trim();
        if(!saveWG()){ toast('存不下了'); return; }
        redraw(); toast('存好了');
      };
    }

    var f = body.querySelector('#wg-file');
    var pk = body.querySelector('#wg-pick');
    /* 情侣卡没有整卡换图那块，这两个元素会不存在 */
    if(f && pk){
    pk.onclick = function(){ f.click(); };
    f.onchange = function(){
      var file = this.files && this.files[0];
      if(!file) return;
      this.value = '';
      toast('在读图片…');
      readImage(file, function(img, err){
        if(err){ toast('这张图读不了'); return; }
        /* 先让她自己框一块，再压缩存下来 */
        openCropper(img, it.w / it.h, function(dataUrl){
          var d = wgData(k);
          var old = d.img;
          d.img = dataUrl;
          if(!saveWG()){
            if(old) d.img = old; else delete d.img;
            saveWG();
            toast('存不下了，图太多或太大');
            return;
          }
          redraw(); paint(); toast('图换好了');
        });
      });
    };
    }
    var cr = body.querySelector('#wg-crop');
    if(cr) cr.onclick = function(){
      var d = wgData(k);
      if(!d.img) return;
      var im = new Image();
      im.onerror = function(){ toast('这张图读不了'); };
      im.onload = function(){
        openCropper(im, it.w / it.h, function(dataUrl){
          var old = d.img;
          d.img = dataUrl;
          if(!saveWG()){ d.img = old; saveWG(); toast('存不下了'); return; }
          redraw(); paint(); toast('裁好了');
        });
      };
      im.src = d.img;
    };
    var ic = body.querySelector('#wg-imgclr');
    if(ic) ic.onclick = function(){
      delete wgData(k).img; saveWG(); redraw(); paint(); toast('图去掉了');
    };
    var sv = body.querySelector('#wg-save');
    if(sv) sv.onclick = function(){
      var d = wgData(k);
      var tEl = body.querySelector('#wg-title');
      var xEl = body.querySelector('#wg-text');
      if(tEl) d.title = (tEl.value || '').trim();
      if(xEl) d.text = (xEl.value || '').trim();
      ['say1','say2','kao1','kao2','song','lyric1','lyric2'].forEach(function(f){
        var el = body.querySelector('#wg-' + f);
        if(el) d[f] = (el.value || '').trim();
      });
      if(!saveWG()){ toast('存不下了'); return; }
      redraw(); toast('存好了');
    };
    /* 情侣卡两个头像：各自挑图，按 1:1 裁，分别存进 img1/img2 */
    var af = body.querySelector('#pw-avafile');
    if(af){
      var slot = 0;
      body.querySelectorAll('[data-pwpick]').forEach(function(el){
        el.onclick = function(){ slot = +el.dataset.pwpick; af.click(); };
      });
      af.onchange = function(){
        var file = this.files && this.files[0];
        if(!file || !slot) return;
        this.value = '';
        toast('在读图片…');
        readImage(file, function(img, err){
          if(err){ toast('这张图读不了'); return; }
          openCropper(img, 1, function(dataUrl){
            var d = wgData(k);
            var key = 'img' + slot;
            var old = d[key];
            d[key] = dataUrl;
            if(!saveWG()){
              if(old) d[key] = old; else delete d[key];
              saveWG();
              toast('存不下了，图太多或太大');
              return;
            }
            redraw(); paint(); toast('头像换好了');
          });
        });
      };
      body.querySelectorAll('[data-pwclr]').forEach(function(el){
        el.onclick = function(){
          delete wgData(k)['img' + el.dataset.pwclr];
          saveWG(); redraw(); paint(); toast('去掉了');
        };
      });
    }
    /* 背景图：按卡片当前形状裁，存到 d.bg，垫在最底层 */
    var bf = body.querySelector('#pw-bgfile');
    if(bf){
      var bgpick = body.querySelector('#pw-bgpick');
      if(bgpick) bgpick.onclick = function(){ bf.click(); };
      bf.onchange = function(){
        var file = this.files && this.files[0];
        if(!file) return;
        this.value = '';
        toast('在读图片…');
        readImage(file, function(img, err){
          if(err){ toast('这张图读不了'); return; }
          openCropper(img, it.w / it.h, function(dataUrl){
            var d = wgData(k);
            var old = d.bg;
            d.bg = dataUrl;
            if(!saveWG()){
              if(old) d.bg = old; else delete d.bg;
              saveWG();
              toast('存不下了，图太多或太大');
              return;
            }
            redraw(); paint(); toast('背景换好了');
          });
        });
      };
      var bgcrop = body.querySelector('#pw-bgcrop');
      if(bgcrop) bgcrop.onclick = function(){
        var d = wgData(k);
        if(!d.bg){ toast('还没有背景图'); return; }
        var im = new Image();
        im.onload = function(){
          openCropper(im, it.w / it.h, function(dataUrl){
            var dd = wgData(k);
            var old = dd.bg;
            dd.bg = dataUrl;
            if(!saveWG()){
              dd.bg = old; saveWG();
              toast('存不下了');
              return;
            }
            redraw(); paint(); toast('裁好了');
          });
        };
        im.onerror = function(){ toast('这张图读不了'); };
        im.src = d.bg;
      };
      var bgclr = body.querySelector('#pw-bgclr');
      if(bgclr) bgclr.onclick = function(){
        delete wgData(k).bg;
        saveWG(); redraw(); paint(); toast('背景去掉了');
      };
    }
    body.querySelectorAll('[data-w]').forEach(function(el){
      el.onclick = function(){ setSize(+el.dataset.w, it.h); };
    });
    body.querySelectorAll('[data-h]').forEach(function(el){
      el.onclick = function(){ setSize(it.w, +el.dataset.h); };
    });
    body.querySelectorAll('[data-size]').forEach(function(el){
      el.onclick = function(){
        var s = WSIZE[el.dataset.size];
        if(s) setSize(s.cols, s.rows);
      };
    });
    body.querySelector('#wg-del').onclick = function(){
      delWidget(k); closeWin();
    };
  }
  paint();
}

function delWidget(k){
  var pos = locateWG(k);
  if(!pos) return;
  L.screens[pos.si].splice(pos.index, 1);
  delete WG[k];
  saveWG(); saveLayout();
  drawScreens(); drawDock(); gotoScreen(cur);
  toast('卡片删了');
}

/* 往某一屏加一张卡片 */
function addWidget(si, wkind){
  if(!WKIND[wkind]) return;
  var sz = WSIZE[WKIND[wkind].dft] || { cols:2, rows:2 };
  var spot = pickSpot(si, sz.cols, sz.rows);
  var it = { t:'w', w2:wkind, k:newWKey(), x:spot.x, y:spot.y, w:sz.cols, h:sz.rows };
  L.screens[si].push(it);
  /* 情侣卡新加时先塞上默认台词，空着看不出效果 */
  if(wkind === 'pairw'){
    var pd = wgData(it.k);
    pd.say1 = '喜欢你'; pd.say2 = '讨厌你';
    pd.kao1 = '^ω^';   pd.kao2 = '>ㅅ<';
    saveWG();
  }
  saveLayout();
  drawScreens(); drawDock(); gotoScreen(si);
  toast('加了张' + WKIND[wkind].name);
  if(wkind === 'photo' || wkind === 'frame' || wkind === 'pairw') editWidget(it.k);
}

/* 挑卡片类型 */
function pickWidget(si){
  var body = openWin('加张卡片', '');
  var h = '<div class="card"><h3>挑一种</h3>';
  Object.keys(WKIND).forEach(function(wk){
    var w = WKIND[wk];
    h += '<div class="thm" data-wk="' + wk + '">' +
           '<div class="tx">' + w.name + '<small>' + w.sub + ' · 默认 ' + w.dft + '</small></div>' +
         '</div>';
  });
  h += '</div>';
  h += '<div class="card hint">卡片放上桌面后：点一下进编辑（换图、写字、改大小），长按进整理态能拖着换位置，左上角小叉删掉。</div>';
  body.innerHTML = h;
  body.querySelectorAll('[data-wk]').forEach(function(el){
    el.onclick = function(){ closeWin(); addWidget(si, el.dataset.wk); };
  });
}

function addPage(){
  L.screens.push([]);
  saveLayout(); drawScreens();
  gotoScreen(L.screens.length - 1);
  toast('加了第 ' + L.screens.length + ' 屏');
}
function delPage(si){
  if(L.screens.length <= 1){ toast('只剩一屏了，删不了'); return; }
  L.screens.splice(si, 1);
  if(cur > L.screens.length - 1) cur = L.screens.length - 1;
  saveLayout(); drawScreens(); gotoScreen(cur);
  toast('删掉一屏');
}
function countApps(){
  var n = 0;
  L.screens.forEach(function(s){ s.forEach(function(it){ if(isApp(it)) n++; }); });
  return n;
}
function countWidgets(){
  var n = 0;
  L.screens.forEach(function(s){ s.forEach(function(it){ if(isWidget(it)) n++; }); });
  return n;
}

/* ---------- 小工具 ---------- */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function weekday(d){ return '星期' + ['日','一','二','三','四','五','六'][d.getDay()]; }
function dayOfYear(d){
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}
function tzName(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || '本地'; }catch(e){ return '本地'; }
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&#' + '34;',"'":'&#39;' }[c];
  });
}
/* ---------- 自由卡层编辑器 ---------- */
function openFreeEditor(k){
  var d = wgData(k);
  if(!d.layers) d.layers = [];

  var html = '<div style="display:flex;flex-direction:column;height:100%;">';
  html += '<div class="head"><div class="back">取消</div><div class="title">组装卡片</div><div class="btn" id="f-done">保存</div></div>';
  
  html += '<div class="body" style="padding:16px;overflow-y:auto;flex:1">';
  
  html += '<div class="card center" style="padding:12px;background:#1a1a1e;position:relative;">';
  html += ' <div id="f-pv" style="width:200px;height:200px;background:#2a2a2e;margin:0 auto;position:relative;border-radius:20px;overflow:hidden;"></div>';
  html += ' <div class="hint" style="margin-top:12px">这里只是粗略预览效果</div>';
  html += '</div>';

  html += '<div style="display:flex;gap:12px;margin:16px 0;">';
  html += ' <button class="btn" id="f-add-txt" style="flex:1">加文字</button>';
  html += ' <button class="btn" id="f-add-img" style="flex:1">加图片/色块</button>';
  html += '</div>';

  html += '<div id="f-lylist" style="display:flex;flex-direction:column;gap:8px;"></div>';
  
  html += '</div></div>';

  var page = document.createElement('div');
  page.className = 'page p-fedit win anim-r';
  page.style.zIndex = 100;
  page.style.position = 'fixed';
  page.style.inset = '0';
  page.style.background = '#0b0b0d';
  page.innerHTML = html;
  document.body.appendChild(page);

  setTimeout(function(){ page.classList.remove('anim-r'); }, 50);

  function renderList(){
    var lb = page.querySelector('#f-lylist');
    var h = '';
    d.layers.forEach(function(ly, i){
      h += '<div class="card row" style="align-items:center;" data-i="' + i + '">';
      if(ly.type === 'text'){
        h += '<div style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px">' + (esc(ly.text) || '（空文字）') + '</div>';
        h += '<div style="color:rgba(255,255,255,0.4);font-size:13px;padding:0 8px">文字层</div>';
      } else if(ly.type === 'img'){
        if(ly.src) {
           h += '<div style="width:30px;height:30px;border-radius:6px;background:url(\'' + ly.src + '\') center/cover"></div>';
        } else {
           h += '<div style="width:30px;height:30px;border-radius:6px;background:' + (ly.bg || '#333') + '"></div>';
        }
        h += '<div style="flex:1;padding-left:10px;font-size:15px">图层</div>';
      }
      h += '<div class="f-ly-up" style="color:#00a3ff;font-size:15px;padding:8px">↑</div>';
      h += '<div class="f-ly-edit" style="color:#00a3ff;font-size:15px;padding:8px">编</div>';
      h += '<div class="f-ly-del" style="color:#ff6e6e;font-size:15px;padding:8px">删</div>';
      h += '</div>';
    });
    if(!d.layers.length) h = '<div class="hint center" style="padding:20px">还没加任何图层</div>';
    lb.innerHTML = h;

    lb.querySelectorAll('.f-ly-del').forEach(function(el){
      el.onclick = function(){
        d.layers.splice(el.closest('[data-i]').dataset.i, 1);
        renderList(); renderPv();
      };
    });
    lb.querySelectorAll('.f-ly-up').forEach(function(el){
      el.onclick = function(){
        var i = +el.closest('[data-i]').dataset.i;
        if(i > 0) {
           var t = d.layers[i]; d.layers[i] = d.layers[i-1]; d.layers[i-1] = t;
           renderList(); renderPv();
        }
      };
    });
    lb.querySelectorAll('.f-ly-edit').forEach(function(el){
      el.onclick = function(){
        openLayerEditor(d.layers[el.closest('[data-i]').dataset.i], function(){ renderList(); renderPv(); });
      };
    });
  }

  function renderPv(){
    var p = page.querySelector('#f-pv');
    var pos = locateWG(k);
    if(pos) { p.style.width = (pos.it.w * 60) + 'px'; p.style.height = (pos.it.h * 60) + 'px'; }

    var sh = '';
    d.layers.forEach(function(ly){
      var st = 'position:absolute;';
      if(ly.x != null) st += 'left:' + ly.x + '%;';
      if(ly.y != null) st += 'top:' + ly.y + '%;';
      if(ly.w != null) st += 'width:' + ly.w + '%;';
      if(ly.h != null) st += 'height:' + ly.h + '%;';
      if(ly.color) st += 'color:' + ly.color + ';';
      if(ly.r != null) st += 'border-radius:' + ly.r + 'px;';
      if(ly.op != null) st += 'opacity:' + ly.op + ';';
      if(ly.bg) st += 'background:' + ly.bg + ';';

      if(ly.type === 'img'){
        if(ly.src) st += 'background-image:url(\'' + ly.src + '\');background-size:cover;background-position:center;';
        sh += '<div style="' + st + '"></div>';
      } else if (ly.type === 'text') {
        st += 'display:flex;align-items:center;white-space:pre-wrap;';
        if(ly.align) st += 'justify-content:' + ly.align + ';text-align:' + (ly.align==='center'?'center':(ly.align==='flex-end'?'right':'left')) + ';';
        if(ly.size) st += 'font-size:' + ly.size + 'px;';
        if(ly.bold) st += 'font-weight:bold;';
        if(ly.shadow) st += 'text-shadow:0 1px 2px rgba(0,0,0,0.5);';
        sh += '<div style="' + st + '">' + esc(ly.text || '') + '</div>';
      }
    });
    p.innerHTML = sh;
  }

  renderList(); renderPv();

  page.querySelector('.back').onclick = function(){
    page.classList.add('anim-r'); setTimeout(function(){ page.parentNode.removeChild(page); }, 300);
  };
  page.querySelector('#f-done').onclick = function(){
    saveWG(); 
    page.parentNode.removeChild(page);
    saveLayout(); drawScreens();
  };
  page.querySelector('#f-add-txt').onclick = function(){
    d.layers.push({ type:'text', x:10, y:10, w:80, h:80, text:'新文字', size:14, color:'#ffffff', align:'center' });
    renderList(); renderPv();
  };
  page.querySelector('#f-add-img').onclick = function(){
    var ly = { type:'img', x:0, y:0, w:100, h:100, src:'', r:0 };
    d.layers.push(ly);
    openLayerEditor(ly, function(){ renderList(); renderPv(); });
  };
}

function openLayerEditor(ly, cb){
  var body = openWin('设置图层', '');
  var isT = (ly.type === 'text');
  var h = '';
  if(isT){
    h += '<textarea id="l-txt" class="ipt" rows="3" style="width:100%;resize:none" placeholder="文字内容">' + esc(ly.text||'') + '</textarea>';
    h += '<div class="row" style="margin-top:12px">字号<input type="number" id="l-sz" value="' + (ly.size||14) + '" class="ipt" style="width:60px;margin:0 10px"> 颜色<input type="color" id="l-c" value="' + (ly.color||'#ffffff') + '" style="margin-left:10px;height:24px;border:none"></div>';
  } else {
    h += '<div class="card"><div class="row">背景颜色 <input type="color" id="l-bgc" value="' + (ly.bg||'#000000') + '" style="margin:0 10px;height:24px;border:none"></div>';
    h += '<div class="row" style="margin-top:10px">覆盖图片 <button class="btn" id="l-pick" style="flex:1;margin-left:10px">挑一张图</button><input type="file" id="l-f" accept="image/*" style="display:none"></div></div>';
  }

  h += '<div class="card" style="margin-top:12px"><h3>位置和大小 (用 % 百分比)</h3>';
  h += '<div class="row">左<input type="number" id="l-x" value="' + (ly.x||0) + '" class="ipt" style="width:60px;margin:0 10px"> 顶<input type="number" id="l-y" value="' + (ly.y||0) + '" class="ipt" style="width:60px;margin:0 10px"></div>';
  h += '<div class="row" style="margin-top:8px">宽<input type="number" id="l-w" value="' + (ly.w||100) + '" class="ipt" style="width:60px;margin:0 10px"> 高<input type="number" id="l-h" value="' + (ly.h||100) + '" class="ipt" style="width:60px;margin:0 10px"></div>';
  h += '<div class="row" style="margin-top:8px">圆角<input type="number" id="l-r" value="' + (ly.r||0) + '" class="ipt" style="width:60px;margin:0 10px"> px</div>';
  h += '<div class="hint" style="margin-top:6px">坐标是从卡片左上角算的比例，50% 就是在正中间。宽高也是比例，100% 就是占满卡片。</div>';
  h += '</div>';

  h += '<button class="btn" id="l-ok" style="margin-top:16px;background:#00a3ff">保存返回</button>';
  body.innerHTML = h;

  body.querySelector('#l-ok').onclick = function(){
    if(isT){
      ly.text = body.querySelector('#l-txt').value;
      ly.size = parseInt(body.querySelector('#l-sz').value)||14;
      ly.color = body.querySelector('#l-c').value;
    } else {
      ly.bg = body.querySelector('#l-bgc').value;
    }
    ly.x = parseFloat(body.querySelector('#l-x').value)||0;
    ly.y = parseFloat(body.querySelector('#l-y').value)||0;
    ly.w = parseFloat(body.querySelector('#l-w').value)||100;
    ly.h = parseFloat(body.querySelector('#l-h').value)||100;
    ly.r = parseFloat(body.querySelector('#l-r').value)||0;
    closeWin();
    if(cb) cb();
  };

  var pk = body.querySelector('#l-pick');
  if(pk){
    var fi = body.querySelector('#l-f');
    pk.onclick = function(){ fi.click(); };
    fi.onchange = function(){
      var file = this.files && this.files[0];
      if(!file) return;
      this.value = '';
      readImage(file, function(img, err){
        if(err){ toast('图片读取失败'); return; }
        openCropper(img, 1, function(du){
          ly.src = du;
          pk.innerText = '图选好了';
        }); 
      });
    }
  }
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1500);
}

/* ---------- 状态栏 ---------- */
function tickStatus(){
  var d = new Date();
  document.getElementById('sb-time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  document.getElementById('sb-net').textContent = navigator.onLine ? '5G' : '无网';
}
function initBatteryBar(){
  function set(lvl, charging){
    var p = Math.round(lvl * 100);
    document.getElementById('sb-pct').textContent = p + '%';
    var f = document.getElementById('sb-fill');
    f.style.width = p + '%';
    f.style.background = charging ? '#7ee08a' : (p <= 20 ? '#ff7a7a' : '#e9edf5');
  }
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){
      set(b.level, b.charging);
      b.addEventListener('levelchange', function(){ set(b.level, b.charging); });
      b.addEventListener('chargingchange', function(){ set(b.level, b.charging); });
    }).catch(function(){});
  }
}

/* ---------- 事件绑定 ---------- */
function bind(){
  var screens = document.getElementById('screens');
  var lp = null, lpEl = null, sx = 0, sy = 0, suppressClick = false;

  // 横滑到哪一屏
  var st = null;
  screens.addEventListener('scroll', function(){
    if(st) clearTimeout(st);
    st = setTimeout(function(){
      var w = screens.clientWidth || 1;
      var i = Math.round(screens.scrollLeft / w);
      if(i !== cur){ cur = i; syncDots(); }
    }, 60);
  }, { passive:true });

  // 点图标 / 点空格子
  screens.addEventListener('click', function(e){
    if(suppressClick){ suppressClick = false; return; }
    if(e.target.closest('.wgrz')) return;
    var wgx = e.target.closest('.wgx');
    if(wgx){
      var host = wgx.closest('.wg');
      if(host) delWidget(host.dataset.wg);
      return;
    }
    var card = e.target.closest('.wg[data-wg]');
    if(card){
      /* 日历卡平时点开是日历应用，要改图得先进整理态 */
      var cpos = locateWG(card.dataset.wg);
      if(!editing && cpos && cpos.it.w2 === 'calw'){ openApp('calendar'); return; }
      editWidget(card.dataset.wg); return;
    }
    var cell = e.target.closest('.cell');
    if(cell){
      if(editing){ setEditing(false); return; }
      openSheet(+cell.dataset.si, +cell.dataset.cx, +cell.dataset.cy);
      return;
    }
    var app = e.target.closest('.app');
    if(app && app.dataset.app) openApp(app.dataset.app);
  });

  function pt(e){
    var t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
    return { x:t.clientX, y:t.clientY };
  }

  function downHandler(e){
    var p = pt(e);
    sx = p.x; sy = p.y;

    // 拉伸把手优先，按住就进 resize
    var rz = e.target.closest('.wgrz');
    if(rz){
      if(resizeStart(rz, p.x, p.y)) suppressClick = true;
      return;
    }
    if(e.target.closest('.wgx')) return;

    var cell = e.target.closest('.cell');
    if(cell){
      var csi = +cell.dataset.si, ccx = +cell.dataset.cx, ccy = +cell.dataset.cy;
      lp = setTimeout(function(){ lp = null; openSheet(csi, ccx, ccy); }, 420);
      return;
    }
    var app = e.target.closest('.app[data-app],.wg[data-wg]');
    if(!app) return;
    lpEl = app;
    if(editing){
      // 已在整理态：按住就能拖，等一点位移再启动，免得误吞点击
      return;
    }
    lp = setTimeout(function(){
      lp = null;
      setEditing(true);
      suppressClick = true;
      dragStart(app, sx, sy);
      toast(app.dataset.wg ? '拖着换位置，右下角能拉大小' : '拖着换位置，点一下改名');
    }, 450);
  }

  function moveHandler(e){
    var p = pt(e);
    if(RZ){
      if(e.cancelable) e.preventDefault();
      resizeMove(p.x, p.y);
      return;
    }
    if(DG){
      if(e.cancelable) e.preventDefault();
      dragMove(p.x, p.y);
      return;
    }
    var dx = Math.abs(p.x - sx), dy = Math.abs(p.y - sy);
    if(lp && (dx > 8 || dy > 8)){ clearTimeout(lp); lp = null; }
    // 整理态下按着图标拉一下就进拖拽
    if(editing && lpEl && !DG && (dx > 7 || dy > 7)){
      suppressClick = true;
      dragStart(lpEl, p.x, p.y);
      if(e.cancelable) e.preventDefault();
    }
  }

  function upHandler(e){
    if(lp){ clearTimeout(lp); lp = null; }
    lpEl = null;
    if(RZ){
      resizeEnd();
      suppressClick = true;
      return;
    }
    if(DG){
      var p = pt(e);
      dragEnd(p.x, p.y);
      suppressClick = true;
    }
  }

  ['touchstart','mousedown'].forEach(function(ev){
    screens.addEventListener(ev, downHandler, { passive:true });
    document.getElementById('dock').addEventListener(ev, downHandler, { passive:true });
  });
  ['touchmove','mousemove'].forEach(function(ev){
    document.addEventListener(ev, moveHandler, { passive:false });
  });
  ['touchend','touchcancel','mouseup'].forEach(function(ev){
    document.addEventListener(ev, upHandler, { passive:true });
  });

  // 完成按钮
  document.getElementById('editdone').addEventListener('click', function(){
    setEditing(false);
  });

  // dock
  document.getElementById('dock').addEventListener('click', function(e){
    if(suppressClick){ suppressClick = false; return; }
    var app = e.target.closest('.app');
    if(app && app.dataset.app) openApp(app.dataset.app);
  });

  // 圆点跳页
  document.getElementById('dots').addEventListener('click', function(e){
    var d = e.target.closest('.dot');
    if(d) gotoScreen(+d.dataset.go);
  });

  // 窗口返回
  document.getElementById('win-back').addEventListener('click', closeWin);

  // 底部菜单
  document.getElementById('sheet').addEventListener('click', function(e){
    var it = e.target.closest('.item');
    if(!it) return;
    var si = sheetCtx;
    var at = sheetAt ? { x:sheetAt.x, y:sheetAt.y } : null;
    var act = it.dataset.act;
    closeSheet();
    sheetAt = at;   /* 关面板会清掉，这里还回去，让新东西落在点过的那一格 */
    if(act === 'add' && si != null) pickApp(si);
    else if(act === 'addwg' && si != null) pickWidget(si);
    else if(act === 'edit'){ setEditing(true); toast('拖图标换位置，点图标改名'); }
    else if(act === 'theme') renderTheme(openWin('主题外观',''));
    else if(act === 'addpage') addPage();
    else if(act === 'delpage' && si != null) delPage(si);
  });
  document.getElementById('mask').addEventListener('click', closeSheet);

  // 键盘：左右翻页、Esc 退出
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(editing){ setEditing(false); return; }
      closeSheet(); closeWin();
    }
    else if(e.key === 'ArrowRight') gotoScreen(cur + 1);
    else if(e.key === 'ArrowLeft') gotoScreen(cur - 1);
  });

  // 转屏后重新对齐当前屏
  window.addEventListener('resize', function(){
    screens.scrollLeft = cur * screens.clientWidth;
  });

  window.addEventListener('online', tickStatus);
  window.addEventListener('offline', tickStatus);
}

/* 桌面上的时钟卡/日期卡自己走字，只改文字不重绘整屏 */
function tickWidgets(){
  var now = new Date();
  var W = ['周日','周一','周二','周三','周四','周五','周六'];
  var hh = ('0' + now.getHours()).slice(-2), mm = ('0' + now.getMinutes()).slice(-2);
  document.querySelectorAll('.wg[data-wg]').forEach(function(el){
    var pos = locateWG(el.dataset.wg);
    if(!pos) return;
    var box = el.querySelector('.wgin');
    if(!box) return;
    if(pos.it.w2 === 'clockw'){
      var b = box.querySelector('.wgbig');
      if(b) b.textContent = hh + ':' + mm;
      var s = box.querySelector('.wgsm');
      if(s) s.textContent = (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日 ' + W[now.getDay()];
    }else if(pos.it.w2 === 'datew'){
      var m = box.querySelector('.wgmid');
      if(m) m.textContent = (now.getMonth()+1) + '月' + now.getDate() + '日';
      var s2 = box.querySelector('.wgsm');
      if(s2) s2.textContent = W[now.getDay()];
    }else if(pos.it.w2 === 'calw'){
      /* 过零点得把高亮挪到新的今天，跨月还要整块重排。
         月份变了就重画内容，同月只挪 .on，省得每 15 秒重建 30 多个节点。 */
      var mEl = box.querySelector('.cw-m');
      var shown = mEl ? parseInt(mEl.textContent, 10) : NaN;
      if(shown !== now.getMonth() + 1){
        box.innerHTML = wgInner(pos.it, wgData(pos.it.k), !!wgData(pos.it.k).img);
      }else{
        var cur = box.querySelector('.cw-d.on');
        var want = String(now.getDate());
        if(!cur || cur.textContent.trim() !== want){
          if(cur) cur.classList.remove('on');
          var all = box.querySelectorAll('.cw-d:not(.out)');
          for(var q=0;q<all.length;q++){
            if(all[q].textContent.trim() === want){ all[q].classList.add('on'); break; }
          }
        }
      }
    }
  });
}

/* ---------- 启动 ---------- */
applyTheme();
drawScreens();
drawDock();
bind();
wxBindOnce();
tickStatus();
setInterval(tickStatus, 10000);
tickWidgets();
setInterval(tickWidgets, 15000);
initBatteryBar();
syncDots();
